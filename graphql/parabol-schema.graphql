  """A meeting has started"""
  meetingStart
  """A meeting has ended"""
  meetingEnd
  """A stage's time limit has expired"""
  MEETING_STAGE_TIME_LIMIT_END
  """A stage's time limit has started"""
  MEETING_STAGE_TIME_LIMIT_START
  """A retro topic was shared with the team"""
  TOPIC_SHARED
  """A standup response was submitted"""
  STANDUP_RESPONSE_SUBMITTED
}

"""The type of event for a slack notification"""
enum SlackNotificationEventTypeEnum {
  """notification that concerns the whole team"""
  team
  """notification that concerns a single member on the team"""
  member
}

"""An error returned by a mutation using the legacy error pattern"""
type StandardMutationError {
  """The title of the error"""
  title: String
  """The full error"""
  message: String!
}

"""Return object for StartCheckInPayload"""
union StartCheckInPayload = StartCheckInSuccess | ErrorPayload

"""Success result for startCheckIn mutation"""
type StartCheckInSuccess {
  """The newly started check-in meeting"""
  meeting: ActionMeeting!
  """ID of the newly started meeting"""
  meetingId: ID!
  """The team the meeting was started for"""
  team: Team!
  """True if creating the Google Calendar event failed"""
  hasGcalError: Boolean
}

"""Payload broadcast when a participant begins dragging a reflection card"""
type StartDraggingReflectionPayload {
  error: StandardMutationError
  """
  The proposed start/end of a drag. Subject to race conditions, it is up to the client to decide to accept or ignore
  """
  remoteDrag: RemoteReflectionDrag
  meeting: NewMeeting
  meetingId: ID
  reflection: RetroReflection
  reflectionId: ID
  teamId: ID
}

"""Return object for StartRetrospectivePayload"""
union StartRetrospectivePayload = ErrorPayload | StartRetrospectiveSuccess

"""Success result for startRetrospective mutation"""
type StartRetrospectiveSuccess {
  """
  The newly started retrospective meeting. Null when the operation only scheduled a recurring
  series with no meeting starting now (rrule first occurrence is in the future).
  """
  meeting: RetrospectiveMeeting
  """ID of the newly started meeting"""
  meetingId: ID
  """The recurring meeting series, if one was created"""
  meetingSeries: MeetingSeries
  """The team the meeting was started for"""
  team: Team!
  """True if creating the Google Calendar event failed"""
  hasGcalError: Boolean
}

"""Return object for StartSprintPokerPayload"""
union StartSprintPokerPayload = ErrorPayload | StartSprintPokerSuccess

"""Success result for startSprintPoker mutation"""
type StartSprintPokerSuccess {
  """ID of the newly started sprint poker meeting"""
  meetingId: ID!
  """The newly started sprint poker meeting"""
  meeting: PokerMeeting!
  """The team the meeting was started for"""
  team: Team!
  """ID of the team"""
  teamId: ID!
  """
  True if there was an error creating the Google Calendar event. False if there was no error or no gcalInput was provided.
  """
  hasGcalError: Boolean!
}

"""Return value for startTeamPrompt mutation, which could be an error"""
union StartTeamPromptPayload = StartTeamPromptSuccess | ErrorPayload

type StartTeamPromptSuccess {
  """
  The started meeting. Null when the operation only scheduled a recurring series with no
  meeting starting now (rrule first occurrence is in the future).
  """
  meeting: TeamPromptMeeting
  """The recurring meeting series, if one was created."""
  meetingSeries: MeetingSeries
  """The team that started the meeting"""
  team: Team!
  """
  True if there was an error creating the Google Calendar event. False if there was no error or no gcalInput was provided.
  """
  hasGcalError: Boolean
}

"""Payload for a Stripe payment failure event"""
type StripeFailPaymentPayload {
  error: StandardMutationError
  """The organization whose payment failed"""
  organization: Organization
  """The notification to a billing leader stating the payment was rejected"""
  notification: NotifyPaymentRejected!
}

"""
Real-time subscriptions for live meeting, notification, org, task, and team updates
"""
type Subscription {
  """
  Subscribe to all events in a meeting (reflections, votes, stages, etc.)
  """
  meetingSubscription(meetingId: ID!): MeetingSubscriptionPayload!
  """Subscribe to notifications for the current user"""
  notificationSubscription: NotificationSubscriptionPayload!
  """Subscribe to organization-level changes for the current user"""
  organizationSubscription: OrganizationSubscriptionPayload!
  """Subscribe to task changes visible to the current user"""
  taskSubscription: TaskSubscriptionPayload!
  """Subscribe to team-level changes for teams the current user belongs to"""
  teamSubscription: TeamSubscriptionPayload!
}

