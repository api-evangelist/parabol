"""Generic payload to send when user signs up"""
type UserLogInPayload {
  """Error details, if sign-in failed"""
  error: StandardMutationError
  """ID of the signed-in user"""
  userId: ID
  """If a new user is created"""
  isNewUser: Boolean
  """The newly created user, or the existing user"""
  user: User
}

"""Minimal user fields shared across User and UserPreview"""
interface UserPartial {
  """The user ID"""
  id: ID!
  """The user's email address"""
  email: Email!
  """The user's display name"""
  preferredName: String!
  """URL of the user's profile picture"""
  picture: URL!
}

"""Minimal public user profile, used where full User data is not needed"""
type UserPreview implements UserPartial {
  id: ID!
  email: Email!
  preferredName: String!
  picture: URL!
}

"""A count of the number of account tiers a user belongs to."""
type UserTiersCount {
  """The number of starter orgs the user is active upon"""
  tierStarterCount: Int
  """The number of orgs on the team tier the user is active upon"""
  tierTeamCount: Int
  """
  The number of orgs on the team tier the user holds the role of Billing Leader
  """
  tierTeamBillingLeaderCount: Int
  """The user these counts belong to"""
  user: User
}

"""Result of verifying a team invitation token"""
type VerifiedInvitationPayload {
  """Null if the invitation is valid; otherwise the reason it failed"""
  errorType: TeamInvitationErrorEnum
  """
  The name of the person that sent the invitation, present if errorType is expired
  """
  inviterName: String
  """
  The email of the person that sent the invitation, present if errorType is expired
  """
  inviterEmail: String
  """true if the mx record is hosted by google, else falsy"""
  isGoogle: Boolean
  """A string to redirect to the SSO IdP, else null"""
  ssoURL: String
  """The valid invitation, if any"""
  teamInvitation: TeamInvitation
  """Name of the inviting team, present if invitation exists"""
  teamName: String
  """ID of the meeting the invite is linked to, if any"""
  meetingId: ID
  """Name of the meeting the invite is linked to, if any"""
  meetingName: String
  """Type of the meeting the invite is linked to, if any"""
  meetingType: MeetingTypeEnum
  """The userId of the invitee, if already a parabol user"""
  userId: ID
  """The invitee, if already a parabol user, present if errorType is null"""
  user: User
}

"""Return object for VoteForPokerStoryPayload"""
union VoteForPokerStoryPayload = ErrorPayload | VoteForPokerStorySuccess

"""Success result for voteForPokerStory mutation"""
type VoteForPokerStorySuccess {
  """The stage that holds the updated scores"""
  stage: EstimateStage!
}

"""Return value for voteForReflectionGroup mutation"""
type VoteForReflectionGroupPayload {
  error: StandardMutationError
  """The meeting where the vote occurred"""
  meeting: RetrospectiveMeeting
  """The meeting member who voted"""
  meetingMember: RetrospectiveMeetingMember
  """The reflection group that received the vote"""
  reflectionGroup: RetroReflectionGroup
  """The stages that were locked or unlocked by having at least 1 vote"""
  unlockedStages: [NewMeetingStage!]
}

"""Payload sent when the voting phase of a retrospective is complete"""
type VotePhaseCompletePayload {
  """The current meeting"""
  meeting: RetrospectiveMeeting
}

