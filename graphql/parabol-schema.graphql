schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

"""
Require a personal access token to have the given OAuth scope.
No-op for requests authenticated with a regular JWT.
"""
directive @scope(name: OAuthScopeEnum!) on FIELD_DEFINITION

directive @stream_HACK on FIELD

directive @defer on FRAGMENT_SPREAD

"""
A saved prompt submitted to an LLM (e.g. OpenAI) by a user. Stores the content sent and metadata about usage. Use to retrieve or display a user's AI prompt history.
"""
type AIPrompt {
  """The unique ID of this AI prompt record"""
  id: ID!
  """The ID of the user who created this prompt"""
  userId: ID!
  """the AI-generated title of the content"""
  title: String!
  """
  Plaintext of the content sent to the LLM. Does not include a preamble that includes formatting rules or type of data to expect
  """
  content: String!
  createdAt: DateTime!
  """The time the prompt was last used"""
  lastUsedAt: DateTime!
  """true if the prompt is owned by the user"""
  isUserDefined: Boolean!
}

"""
Return value for acceptRequestToJoinDomain mutation. Returns either an error or the updated viewer after a pending domain-join request has been approved by an org admin.
"""
union AcceptRequestToJoinDomainPayload = ErrorPayload | AcceptRequestToJoinDomainSuccess

"""
Successful result of acceptRequestToJoinDomain. The requesting user has been added to the organization that owns the verified email domain.
"""
type AcceptRequestToJoinDomainSuccess {
  """
  The current authenticated user, now a member of the organization that accepted their domain-join request
  """
  viewer: User!
}

"""
Return value for acceptTeamInvitation mutation. On success, contains a new auth token and the team the user joined. On failure, contains a StandardMutationError.
"""
type AcceptTeamInvitationPayload {
  error: StandardMutationError
  """
  A new JWT auth token issued after joining the team; the client should replace its current token with this one
  """
  authToken: ID
  """The ID of an in-progress meeting to redirect the user to after joining"""
  meetingId: ID
  """The in-progress meeting the user should be redirected to, if any"""
  meeting: NewMeeting
  """The team that the invitee joined"""
  team: Team
  """The new TeamMember record created for the user on the team"""
  teamMember: TeamMember
  """
  Any pending team-invitation notifications for the joining user that can now be dismissed
  """
  notifications: [NotificationTeamInvitation!]
  """
  The team lead user, updated with new suggested actions after a member joins
  """
  teamLead: User
}

"""
A Check-In meeting (also called an Action meeting). A structured team standup where members check in, review agenda items, and create or update tasks. Use to query details of a completed or in-progress Check-In meeting.
"""
type ActionMeeting implements NewMeeting {
  """
  The viewer's most recently generated AI inspiration items for a given integration service,
  cached for a short window. Empty if none have been generated recently.
  """
  inspirationItems(service: ServiceEnum!): [InspirationItem!]!
  """The unique meeting id. shortid."""
  id: ID!
  """The timestamp the meeting was created"""
  createdAt: DateTime!
  """
  The id of the user that created the meeting, null if user was hard deleted
  """
  createdBy: ID
  """The user that created the meeting, null if user was hard deleted"""
  createdByUser: User
  """The timestamp the meeting officially ended"""
  endedAt: DateTime
  """The location of the facilitator in the meeting"""
  facilitatorStageId: ID!
  """The userId (or anonymousId) of the most recent facilitator"""
  facilitatorUserId: ID!
  """The facilitator team member"""
  facilitator: TeamMember!
  """Is this locked for starter plans?"""
  locked: Boolean!
  """The team members that were active during the time of the meeting"""
  meetingMembers: [ActionMeetingMember!]!
  """The auto-incrementing meeting number for the team"""
  meetingNumber: Int!
  """The id of the meeting series this meeting belongs to"""
  meetingSeriesId: ID
  """
  The meeting series this meeting is associated with if the meeting is recurring
  """
  meetingSeries: MeetingSeries
  """Always ACTION for this meeting type"""
  meetingType: MeetingTypeEnum!
  """The name of the meeting"""
  name: String!
  """The organization this meeting belongs to"""
  organization: Organization!
  """
  The phases the meeting will go through, including all phase-specific state
  """
  phases: [NewMeetingPhase!]!
  """
  If meeting has a meeting series associated, this is the time the meeting will end
  """
  scheduledEndTime: DateTime
  """
  The OpenAI generated summary of all the content in the meeting, such as reflections, tasks, and comments. Undefined if the user doesnt have access to the feature or it's unavailable in this meeting type`
  """
  summary: String
  """The time the meeting summary was emailed to the team"""
  summarySentAt: DateTime
  """foreign key for team"""
  teamId: ID!
  """The team that ran the meeting"""
  team: Team!
  """The last time a meeting was updated (stage completed, finished, etc)"""
  updatedAt: DateTime
  """The action meeting member of the viewer"""
  viewerMeetingMember: ActionMeetingMember
  """A single agenda item"""
  agendaItem(agendaItemId: ID!): AgendaItem
  """The number of agenda items generated in the meeting"""
  agendaItemCount: Int!
  """All of the agenda items for the meeting"""
  agendaItems: [AgendaItem!]!
  """The number of comments generated in the meeting"""
  commentCount: Int!
  """The number of tasks generated in the meeting"""
  taskCount: Int!
  """The tasks created within the meeting"""
  tasks: [Task!]!
  """
  The ID of the publicly shareable summary page for this meeting, if one has been generated
  """
  summaryPageId: ID
}

"""
Represents a team member's participation record in a Check-In (Action) meeting. Tracks which tasks were completed or assigned during the meeting for that member.
"""
type ActionMeetingMember implements MeetingMember {
  """A composite of userId::meetingId"""
  id: ID!
  """true if present, false if absent, else null"""
  isCheckedIn: Boolean @deprecated(reason: "Members are checked in when they enter the meeting now & not created beforehand")
  """The ID of the meeting this member record belongs to"""
  meetingId: ID!
  """Always ACTION for this meeting type"""
  meetingType: MeetingTypeEnum!
  """The ID of the team this meeting belongs to"""
  teamId: ID!
  """The team member associated with this participation record"""
  teamMember: TeamMember!
  """The user associated with this participation record"""
  user: User!
  """The ID of the user associated with this participation record"""
  userId: ID!
  """The last time a meeting was updated (stage completed, finished, etc)"""
  updatedAt: DateTime!
  """The tasks marked as done in the meeting"""
  doneTasks: [Task!]!
  """The tasks assigned to members during the meeting"""
  tasks: [Task!]!
}

"""
Configuration settings for Check-In (Action) meetings on a team. Controls which phases are included in the meeting flow.
"""
type ActionMeetingSettings implements TeamMeetingSettings {
  """The unique ID of this settings record"""
  id: ID!
  """The type of meeting these settings apply to"""
  meetingType: MeetingTypeEnum!
  """The broad phase types that will be addressed during the meeting"""
  phaseTypes: [NewMeetingPhaseTypeEnum!]!
  """FK"""
  teamId: ID!
  """The team these settings belong to"""
  team: Team!
}

"""
Return value for addAgendaItem mutation. On success, contains the newly created agenda item and the updated meeting. On failure, contains a StandardMutationError.
"""
type AddAgendaItemPayload {
  error: StandardMutationError
  """The newly created agenda item"""
  agendaItem: AgendaItem
  """
  The ID of the meeting this agenda item was added to, if the item was added during an active meeting
  """
  meetingId: ID
  """The meeting with the updated agenda item, if any"""
  meeting: NewMeeting
}

"""
Return value for addApprovedOrganizationDomains mutation. Returns either an error or the updated organization after new email domains are approved for auto-join.
"""
union AddApprovedOrganizationDomainsPayload = ErrorPayload | AddApprovedOrganizationDomainsSuccess

"""
Successful result of addApprovedOrganizationDomains. The specified email domains have been added to the organization's approved list, allowing users with matching email addresses to auto-join.
"""
type AddApprovedOrganizationDomainsSuccess {
  """The ID of the organization whose approved domains were updated"""
  orgId: ID!
  """Organization with the updated approved domain list"""
  organization: Organization!
}

"""
Return value for addAtlassianAuth mutation. On success, contains the new Atlassian (Jira Cloud) integration and the updated team member. On failure, contains a StandardMutationError.
"""
type AddAtlassianAuthPayload {
  error: StandardMutationError
  """
  The newly created Atlassian (Jira Cloud) integration for the team member
  """
  atlassianIntegration: AtlassianIntegration
  """The ID of the team the Atlassian auth was connected to"""
  teamId: ID
  """The team member with the updated Atlassian auth"""
  teamMember: TeamMember
  """The user with the updated Atlassian auth"""
  user: User
}

input AddCommentInput {
  """A stringified TipTap JSONContent  document containing thoughts"""
  content: String!
  """true if the comment should be anonymous"""
  isAnonymous: Boolean
  """foreign key for the discussion this was created in"""
  discussionId: ID!
  """
  The sort order of this comment within its thread (used to order replies)
  """
  threadSortOrder: Int!
  """
  The ID of the parent comment if this is a reply; omit for top-level comments
  """
  threadParentId: ID
}

"""
Return value for addComment mutation. Returns either an error or the newly created comment along with the meeting it belongs to.
"""
union AddCommentPayload = ErrorPayload | AddCommentSuccess

"""
Successful result of addComment. The comment has been added to the specified discussion thread.
"""
type AddCommentSuccess {
  """The comment that was just created"""
  comment: Comment!
  """The ID of the meeting where the comment was added"""
  meetingId: ID!
}

"""
Return value for addGitHubAuth mutation. On success, contains the new GitHub integration and the updated team member. On failure, contains a StandardMutationError.
"""
type AddGitHubAuthPayload {
  error: StandardMutationError
  """The newly created GitHub integration for the team member"""
  githubIntegration: GitHubIntegration
  """The team member with the updated GitHub auth"""
  teamMember: TeamMember
  """The user with the updated GitHub auth"""
  user: User
}

"""An Integration Provider configuration"""
input AddIntegrationProviderInput {
  """
  The team that the token is linked to
  Must be provided if scope is 'team'
  """
  teamId: ID
  """
  The organization this provider is associated with
  Must be provided if scope is 'org'
  """
  orgId: ID
  """The service this provider is associated with"""
  service: IntegrationProviderServiceEnum!
  """The kind of token used by this provider"""
  authStrategy: IntegrationProviderAuthStrategyEnum!
  """
  The scope this provider configuration was created at (org-wide, or by the team)
  """
  scope: IntegrationProviderEditableScopeEnum!
  """
  Webhook provider metadata, has to be non-null if token type is webhook, refactor once we get https://github.com/graphql/graphql-spec/pull/825
  """
  webhookProviderMetadataInput: IntegrationProviderMetadataInputWebhook
  """
  OAuth1 provider metadata, has to be non-null if token type is OAuth1, refactor once we get https://github.com/graphql/graphql-spec/pull/825
  """
  oAuth1ProviderMetadataInput: IntegrationProviderMetadataInputOAuth1
  """
  OAuth2 provider metadata, has to be non-null if token type is OAuth2, refactor once we get https://github.com/graphql/graphql-spec/pull/825
  """
  oAuth2ProviderMetadataInput: IntegrationProviderMetadataInputOAuth2
  """
  Shared secret provider metadata, has to be non-null if token type is shared secret
  """
  sharedSecretMetadataInput: IntegrationProviderMetadataInputSharedSecret
}

"""
Return value for addIntegrationProvider mutation. Returns either an error or the newly registered integration provider configuration.
"""
union AddIntegrationProviderPayload = ErrorPayload | AddIntegrationProviderSuccess

"""
Successful result of addIntegrationProvider. The integration provider has been registered and is now available for use by teams or org members.
"""
type AddIntegrationProviderSuccess {
  """The newly registered integration provider"""
  provider: IntegrationProvider!
  """
  The updated set of organization-level integration providers, if the new provider affects org scope
  """
  orgIntegrationProviders: OrgIntegrationProviders
  """
  Updated team member integrations, if the new provider affects team scope
  """
  teamMemberIntegrations: TeamMemberIntegrations
}

"""
Return value for addNewFeature mutation. Contains the new feature broadcast that was announced to all users.
"""
type AddNewFeaturePayload {
  """The new feature announcement broadcast to all users"""
  newFeature: NewFeatureBroadcast
}

"""
Subscription payload sent when a new notification is created for the current user. Use this to update the client's notification list in real time.
"""
type AddNotificationPayload {
  """The newly created notification for the current user"""
  notification: Notification
}

"""
Discriminates between adding and removing an item in a collection. Used as the
action field on mutation inputs (e.g. UpdatePokerScopeItemInput) where a single
mutation handles both insert and removal rather than exposing separate add/remove
mutations.
"""
enum AddOrDeleteEnum {
  """
  Insert the item into the collection. Use this when the item does not yet
  exist in the target set and should be added (e.g. adding a task to the
  scope of a sprint poker meeting).
  """
  ADD
  """
  Remove the item from the collection. Use this when the item already exists
  in the target set and should be removed (e.g. removing a task from the
  scope of a sprint poker meeting).
  """
  DELETE
}

"""
Payload returned after the addOrg mutation, which creates a new organization with an initial team and adds the caller as the team leader.
"""
type AddOrgPayload {
  """The newly created organization."""
  organization: Organization
  error: StandardMutationError
  """
  The first team created inside the new organization. Every new org starts with exactly one team.
  """
  team: Team
  """
  The TeamMember record for the caller, who is automatically added as the leader of the new team.
  """
  teamMember: TeamMember
  """
  The ID of the 'Create a New Team' suggested action that was removed from the caller's dashboard as a result of this mutation. Null if no such suggestion existed.
  """
  removedSuggestedActionId: ID
}

"""
The payload returned after adding a new dimension to a poker template.
A dimension represents a scoring axis (e.g., effort, complexity, business value) that participants
estimate during a Sprint Poker meeting. On success, the new dimension is appended to the template
and broadcast to all team members via the TEAM subscription channel.
"""
type AddPokerTemplateDimensionPayload {
  """
  Present when the mutation fails (e.g., template not found, dimension limit reached).
  Null on success.
  """
  error: StandardMutationError
  """The newly created dimension. Null when an error occurred."""
  dimension: TemplateDimension
}

"""
The result of the addPokerTemplate mutation, which creates a new Sprint Poker template for a team.
A template can be created from scratch (with a single default dimension) or cloned from an existing
template (copies all dimensions from the parent). Returns either a success object containing the
new template and the creating user, or an ErrorPayload if the operation failed (e.g. the team was
not found, the user has exhausted their free custom template allowance on the starter tier, or the
parent template is not accessible to the viewer).
"""
union AddPokerTemplatePayload = ErrorPayload | AddPokerTemplateSuccess

"""
The payload returned by the addPokerTemplateScale mutation. On success, returns the newly created TemplateScale. If parentScaleId was provided, the new scale is a copy of that parent scale; otherwise a blank scale is created for the team.
"""
type AddPokerTemplateScalePayload {
  """Present when the mutation fails. Null on success."""
  error: StandardMutationError
  """
  The newly created scale, ready to be named and populated with values. Null if the mutation failed.
  """
  scale: TemplateScale
}

"""
The result of the addPokerTemplateScaleValue mutation, which adds a new value
(e.g., a story-point label like "XS" or "?") to an existing poker template scale.
On success, the updated scale — including its full list of values — is returned.
On failure, error is populated and scale is null.
"""
type AddPokerTemplateScaleValuePayload {
  """
  Present when the mutation fails; describes what went wrong. Null on success.
  """
  error: StandardMutationError
  """
  The poker template scale that was modified, now containing the newly added value.
  Use this to update the client-side scale and its values list without a separate refetch.
  Null when an error occurred.
  """
  scale: TemplateScale
}

"""
Returned when the addPokerTemplate mutation succeeds. Contains the newly created (or cloned) poker
template and the user who triggered the operation. Use this to update the client's template list and
reflect the creator's identity without a separate query.
"""
type AddPokerTemplateSuccess {
  """The poker template that was created"""
  pokerTemplate: PokerTemplate!
  """The user that created the template"""
  user: User!
}

"""
The result of the addReactjiToReactable mutation, which adds or removes an emoji reaction on a reactable item (such as a reflection or comment). Returns the updated reactable on success, or an error if the operation failed (e.g. item not found, user lacks permission).
"""
union AddReactjiToReactablePayload = AddReactjiToReactableSuccess | ErrorPayload

"""
Returned when an emoji reaction (reactji) has been successfully added to a reactable item
(a comment, reflection, or response). Use the reactable field to read the updated list of
reactjis and re-render the reaction bar on the item.
"""
type AddReactjiToReactableSuccess {
  """
  The item that received the reactji, with its reactjis list updated to include the new reaction.
  Cast to the concrete type (Comment, RetroReflection, or Poll Response) to access type-specific fields.
  """
  reactable: Reactable!
}

"""
Result of the addReflectTemplate mutation, which creates a new retrospective meeting template for a team (optionally cloned from an existing template via parentTemplateId). Returns AddReflectTemplateSuccess on success, or ErrorPayload if the operation fails (e.g. insufficient permissions, invalid team, or template limit reached).
"""
union AddReflectTemplatePayload = ErrorPayload | AddReflectTemplateSuccess

"""
Returned by the addReflectTemplatePrompt mutation. On success, contains the newly created
ReflectPrompt that was appended to the specified retrospective template. On failure, contains
a StandardMutationError describing what went wrong (e.g. template not found, insufficient
permissions, or the template already has the maximum number of prompts).
"""
type AddReflectTemplatePromptPayload {
  error: StandardMutationError
  """
  The newly created prompt added to the retrospective template. Null when the mutation fails.
  Use this to update the UI with the new prompt, including its generated id, default question
  text, description, groupColor, and sort order within the template.
  """
  prompt: ReflectPrompt
}

"""
Returned when the addReflectTemplate mutation succeeds. This payload is produced in two scenarios:
(1) a brand-new blank reflect (retrospective) template is created for a team, seeded with a single
default prompt; or (2) an existing template is cloned — when parentTemplateId is provided the new
template is named "<original> Copy" (or "<original> Copy #N" for subsequent clones) and all of the
source template's active prompts are duplicated. In both cases the caller's
freeCustomRetroTemplatesRemaining counter is decremented if the team is on the starter tier.
Use the reflectTemplate field to read the created/cloned template immediately and the user field
to update any client-side state that tracks the viewer's remaining free template quota.
"""
type AddReflectTemplateSuccess {
  """
  The newly created or cloned reflect template. For a net-new template this will contain a single
  default prompt named "New prompt". For a clone it will contain copies of every active prompt from
  the source template. Use this to update the team's template list in the client cache.
  """
  reflectTemplate: ReflectTemplate!
  """
  The viewer (authenticated user) who performed the mutation. Returned so the client can refresh
  freeCustomRetroTemplatesRemaining, which is decremented on starter-tier teams each time a custom
  template is created or cloned.
  """
  user: User!
}

"""
Payload returned after a user completes the Slack OAuth flow to connect their Slack account to a Parabol team. On success, slackIntegration and user are populated; on failure, error is populated and the other fields are null.
"""
type AddSlackAuthPayload {
  """
  Present when the mutation failed. Contains a human-readable message and an error code describing why the Slack auth could not be added.
  """
  error: StandardMutationError
  """
  The newly created or updated Slack integration record, linking the Parabol team member to their Slack workspace. Use this to read the resulting bot credentials, default notification channel, and per-event notification settings.
  """
  slackIntegration: SlackIntegration
  """
  The Parabol user whose Slack auth was just added or refreshed. Use this to reflect updated integration state in the UI without a separate user query.
  """
  user: User
}

"""
The result of the addTeamMemberIntegrationAuth mutation, which links an integration provider's
credentials (OAuth2 token, OAuth1 token, personal access token, or webhook URL) to a specific
team member. Returns the updated auth record and related entities on success, or an error if
the authorization could not be stored (e.g. invalid code, provider not found, permission denied).
"""
union AddTeamMemberIntegrationAuthPayload = ErrorPayload | AddTeamMemberIntegrationAuthSuccess

"""
The success payload returned when a team member's integration auth credentials are successfully
added or replaced via the addTeamMemberIntegrationAuth mutation. This payload is returned after
a user completes an OAuth flow (OAuth1, OAuth2) or provides a personal access token (PAT),
and the resulting credentials have been persisted and linked to their account on a specific team.
"""
type AddTeamMemberIntegrationAuthSuccess {
  """
  The newly created or updated auth credential record that was upserted for this team member.
  Contains the access token, refresh token, and related metadata for the integration service.
  """
  integrationAuth: TeamMemberIntegrationAuth!
  """
  The integration service (e.g. github, gitlab, jira, linear) that the newly added auth
  credential is associated with. Denormalized from the integration provider for convenience.
  """
  service: IntegrationProviderServiceEnum!
  """
  The team member record (user + team relationship) whose integration auth was just updated.
  Useful for refreshing the client-side view of which integrations are connected for this person
  on this team.
  """
  teamMember: TeamMember!
  """
  The user who completed the auth flow and whose credentials were saved. This is always the
  currently authenticated viewer — a user can only add auth for themselves.
  """
  user: User!
}

"""
Return payload for the addTeam mutation. Returned when a user creates a new team within an existing organization. Contains the new team, the creator's team membership record, and an optional side-effect indicating that a suggested-action prompt has been dismissed.
"""
type AddTeamPayload {
  """
  Non-null if the mutation failed. Contains an error name and message describing what went wrong.
  """
  error: StandardMutationError
  """The newly created team."""
  team: Team
  """
  The TeamMember record for the user who created the team. Use this to update the viewer's team list and permissions in the client.
  """
  teamMember: TeamMember
  """
  The ID of the 'createNewTeam' suggested action that was automatically dismissed because the user fulfilled it by creating a team. Null if no such suggestion existed. Use this to remove the suggestion from the client UI.
  """
  removedSuggestedActionId: ID
}

"""
Input for adding a new value to an existing poker template scale. Used with the addPokerTemplateScaleValue mutation, which appends a single TemplateScaleValue to the ordered list of values on a TemplateScale. Each scale value represents one option that participants can vote on during a Poker meeting (e.g., a story-point size or complexity tier).
"""
input AddTemplateScaleInput {
  """
  The hex color code (e.g., "#DB70DB") used to visually distinguish this scale value from others on the scale. Colors are displayed in the Poker voting UI next to the label so participants can quickly identify each option.
  """
  color: String!
  """
  A short human-readable label for this scale value shown to participants during voting (e.g., "XS", "M", "L", "1", "8", "?"). Labels must be unique within the scale.
  """
  label: String!
}

"""
The result of the addTranscriptionBot mutation, which attaches a Recall.ai transcription bot to an active Zoom video meeting linked to a retrospective. On success, returns AddTranscriptionBotSuccess containing the updated meeting (with the videoMeetingURL and recallBotId populated). On failure, returns ErrorPayload describing what went wrong (e.g. meeting not found, meeting type is not retrospective).
"""
union AddTranscriptionBotPayload = ErrorPayload | AddTranscriptionBotSuccess

"""
Returned when addTranscriptionBot succeeds. Confirms that a Recall.ai bot has
been dispatched to the video call identified by videoMeetingURL and that the
retrospective meeting record has been updated with that URL. The bot will
join the call, capture a transcript, and store it on the meeting once the
call ends. Use the returned meeting to read the updated videoMeetingURL and,
after the call concludes, the transcription field.
"""
type AddTranscriptionBotSuccess {
  """
  The retrospective meeting that was updated with the video meeting URL and
  the Recall.ai bot assignment. Query videoMeetingURL to confirm the URL that
  was stored, or transcription to retrieve the transcript once the bot has
  finished processing the recording.
  """
  meeting: RetrospectiveMeeting!
}

"""
Subscription payload delivered when a new Notification is created for the current viewer.
Returned as the AddedNotification field on NotificationSubscriptionPayload whenever the
server pushes a freshly-created notification to the client (e.g. a team invitation arrives,
a meeting stage time limit fires, or a payment fails). Use this to insert the notification
into the client-side notification list without requiring a full refetch.
"""
type AddedNotification {
  """
  The newly created notification that was just sent to the viewer. Query its type field
  to determine which concrete Notification implementation was returned and render the
  appropriate UI (e.g. NotificationTeamInvitation, NotificationMeetingStageTimeLimitEnd).
  """
  addedNotification: Notification!
}

"""
A topic a team member wants to discuss during the agenda phase of a Check-In meeting (meetingType: "action"). Agenda items are added before or during a meeting, worked through one-by-one in the AgendaItemsPhase, and cleared when the meeting ends. Items marked as pinned are automatically re-created for the next meeting so recurring topics always appear on the agenda.
"""
type AgendaItem {
  """The unique agenda item id, formatted as teamId::shortid"""
  id: ID!
  """The text description of the topic to discuss. Maximum 64 characters."""
  content: String!
  """The timestamp the agenda item was created"""
  createdAt: DateTime
  """
  True if the agenda item is currently visible and actionable. Set to false when the item is removed or when the meeting ends and non-pinned items are cleared.
  """
  isActive: Boolean!
  """
  The id of the Check-In meeting this agenda item belongs to. Null when the item was added outside of a meeting or carried forward from a previous meeting via pinning.
  """
  meetingId: ID
  """
  True if this agenda item should automatically be re-added to the next meeting when the current meeting ends. Pinned items are cloned at meeting close so they persist across meetings.
  """
  pinned: Boolean
  """
  The id of the original agenda item that was first pinned, tracing the clone lineage across meetings. Null on the original pinned item itself; set on every subsequent clone so the full history of a recurring topic can be retrieved.
  """
  pinnedParentId: ID
  """
  The fractional-index sort order used to position this item in the agenda list
  """
  sortOrder: String!
  """The id of the team this agenda item belongs to"""
  teamId: ID!
  """The team member who created this agenda item"""
  teamMember: TeamMember!
  """The id of the team member who created this agenda item"""
  teamMemberId: ID!
  """The timestamp the agenda item was last updated"""
  updatedAt: DateTime
}

"""
The phase of an Action meeting in which the team works through each agenda item one by one.
Each agenda item gets its own AgendaItemsStage, and the team discusses them in order.
This phase only appears in Action meetings (not retrospectives or poker meetings).
Use this type when traversing meeting phases to find agenda-item discussion stages,
or when you need to know which team's meeting a set of agenda items belongs to.
"""
type AgendaItemsPhase implements NewMeetingPhase {
  """Unique identifier for this phase instance (shortid format)"""
  id: ID!
  """The ID of the Action meeting this phase belongs to"""
  meetingId: ID!
  """The ID of the team running this meeting"""
  teamId: ID!
  """The type of phase — always 'agendaitems' for this type"""
  phaseType: NewMeetingPhaseTypeEnum!
  """
  Ordered list of stages, one per agenda item. Each stage represents the discussion
  of a single agenda item. Navigate through these stages to find or display each
  agenda item's discussion thread.
  """
  stages: [AgendaItemsStage!]!
}

"""The stage where the team discusses a single agenda item"""
type AgendaItemsStage implements NewMeetingStage & DiscussionThreadStage {
  """stageId, shortid"""
  id: ID!
  """The datetime the stage was completed"""
  endAt: DateTime
  """foreign key. try using meeting"""
  meetingId: ID!
  """The meeting this stage belongs to"""
  meeting: NewMeeting!
  """
  true if the facilitator has completed this stage, else false. Should be boolean(endAt)
  """
  isComplete: Boolean!
  """true if any meeting participant can navigate to this stage"""
  isNavigable: Boolean!
  """true if the facilitator can navigate to this stage"""
  isNavigableByFacilitator: Boolean!
  """The phase this stage belongs to"""
  phase: NewMeetingPhase
  """The type of the phase"""
  phaseType: NewMeetingPhaseTypeEnum
  """The datetime the stage was started"""
  startAt: DateTime
  """Number of times the facilitator has visited this stage"""
  viewCount: Int
  """
  true if a time limit is set, false if end time is set, null if neither is set
  """
  isAsync: Boolean
  """true if the viewer is ready to advance, else false"""
  isViewerReady: Boolean!
  """User ids of those who are ready to advance to the next stage"""
  readyUserIds: [ID!]!
  """
  The datetime the phase is scheduled to be finished, null if no time limit or end time is set
  """
  scheduledEndTime: DateTime
  """
  The suggested ending datetime for a phase to be completed async, null if not enough data to make a suggestion
  """
  suggestedEndTime: DateTime
  """
  The suggested time limit for a phase to be completed together, null if not enough data to make a suggestion
  """
  suggestedTimeLimit: Float
  """The team hosting the meeting this stage belongs to"""
  teamId: ID!
  """
  The number of milliseconds left before the scheduled end time. Useful for unsynced client clocks. null if scheduledEndTime is null
  """
  timeRemaining: Float
  """
  The 0-based position of this stage within its phase, ordered by sortOrder.
  """
  stageIdx: Int!
  """The ID to find the discussion that goes in the stage"""
  discussionId: ID!
  """The discussion about the stage"""
  discussion: Discussion!
  """The id of the agenda item this relates to"""
  agendaItemId: ID!
  """
  The agenda item being discussed in this stage. Contains the topic text, who added it, and whether it has been pinned for recurring use
  """
  agendaItem: AgendaItem!
}

"""
Payload returned after archiving an organization. Archiving permanently deactivates the org and all its teams. Only starter-tier orgs can be archived — paid orgs must be downgraded first. On success, all teams are archived, all org memberships are soft-deleted, and suggested actions tied to those teams are removed.
"""
type ArchiveOrganizationPayload {
  error: StandardMutationError
  """
  The ID of the organization that was archived. Use this to remove the org from the client store.
  """
  orgId: ID
  """
  All teams that belonged to the organization and were archived as part of this operation. Use this to update team records in the client store.
  """
  teams: [Team!]
  """
  IDs of suggested actions that were removed because the teams they referenced no longer exist. Use this to purge stale suggested actions from the client store.
  """
  removedSuggestedActionIds: [ID]
}

"""
The action to perform on a page via the archivePage mutation. Pages follow a
soft-delete lifecycle: they are first moved to the trash (archive), and can
then be permanently removed (delete) or recovered (restore). Use `archive` for
the initial move-to-trash step, `delete` only when the page is already in the
trash and permanent removal is intended, and `restore` to undo a previous
archive.
"""
enum ArchivePageActionEnum {
  """
  Move the page to the trash. The page is soft-deleted and hidden from normal
  views but can still be restored. This is the first step in the delete
  lifecycle.
  """
  archive
  """
  Permanently delete the page from the trash. The page must already be in the
  trash (i.e., previously archived). This action is irreversible.
  """
  delete
  """
  Restore the page from the trash back to its original location. The page must
  currently be in the trash (i.e., previously archived but not yet permanently
  deleted).
  """
  restore
}

"""
The return payload for the archivePage mutation, which handles all three steps
of a page's soft-delete lifecycle: moving to trash (archive), permanent removal
(delete), and recovery (restore). Check pageId to confirm which page was acted
on, and inspect page (or its absence) to determine the resulting state.
"""
type ArchivePagePayload {
  """
  The ID of the page that was acted on. Always present so callers can update
  local state even when the page object itself is no longer accessible.
  """
  pageId: String
  """
  The affected page after the action was applied. Null when the page was
  permanently deleted (hard-deleted), because no record remains to return.
  Present after an archive (soft-delete) or restore action, allowing the
  caller to read the updated deletedAt and other fields.
  """
  page: Page
}

"""
Return value for the archiveTeam mutation. When a team is archived (or deleted if unused),
this payload delivers the updated team record, a notification sent to all former members,
the IDs of any homepage suggested-action cards that were removed, and the IDs of meeting
templates owned by the team so clients can remove them from local caches.
"""
type ArchiveTeamPayload {
  error: StandardMutationError
  """
  The team that was archived (or deleted). Inspect team.isArchived to distinguish the two cases.
  Null when the operation fails.
  """
  team: Team
  """
  A notification explaining that the team was archived and removed from view
  """
  notification: NotifyTeamArchived
  """
  IDs of suggested-action cards (e.g. "Invite your team", "Try a retro") that were shown on the
  user's homepage and are now removed because they referenced this team. Clients should evict
  these records from their caches.
  """
  removedSuggestedActionIds: [ID]
  """A list of the ids of templates created by a team"""
  teamTemplateIds: [ID!]!
}

"""
The result of the archiveTimelineEvent mutation, which hides a timeline event from the user's activity feed. Returns either a success object containing the updated event or an error if the event could not be found or the caller lacks permission to archive it.
"""
union ArchiveTimelineEventPayload = ErrorPayload | ArchiveTimelineEventSuccess

"""
Returned when the archiveTimelineEvent mutation succeeds. Archiving a timeline
event sets its isActive flag to false, hiding it from the viewer's activity
feed without permanently deleting it. Use this payload to update local state
so the event is removed from the displayed timeline.
"""
type ArchiveTimelineEventSuccess {
  """
  The timeline event that was just archived. Its isActive field will be false.
  Use this to remove or hide the event in the caller's UI after a successful mutation.
  """
  timelineEvent: TimelineEvent!
}

"""
The area of the application UI from which a task mutation (createTask, updateTask) was triggered.
Used for analytics and context tracking so the server knows which view the user was in when they
created or modified a task.
"""
enum AreaEnum {
  """
  The user was inside an active meeting (e.g. Action, Retrospective, Poker) when the task was
  created or updated. Use this value when the task card is rendered within a meeting room.
  """
  meeting
  """
  The user was on the Team Dashboard (the per-team task board at /team/:teamId/tasks) when the
  task was created or updated. Use this value when the task card is rendered in the team task
  columns view.
  """
  teamDash
  """
  The user was on their personal My Dashboard (the cross-team task view at /me/tasks) when the
  task was created or updated. Use this value when the task card is rendered in the user-scoped
  task columns view.
  """
  userDash
}

"""
Controls who can read an uploaded asset. The scope is encoded into the asset's storage path
(e.g. Team/<teamId>/assets/<hash>.webp) and is enforced at both upload time and serve time.
Choose the narrowest scope that satisfies the use-case so that assets are not inadvertently
exposed to unrelated users.
"""
enum AssetScopeEnum {
  """
  Asset is tied to a single Page (a collaborative document). Any user with at least viewer
  access to that page can read the asset. The scopeKey must be the page's client-side
  cipher ID, and the uploader must hold commentor or higher access to the page.
  Use this scope for files or images embedded inside a specific page.
  """
  Page
  """
  Asset is private to a single user. Only the owning user (or the ghost user) can read
  non-avatar assets stored under this scope. Profile pictures (assetType = "picture") are
  an exception and are visible to all authenticated users.
  The scopeKey must equal the caller's own userId.
  Use this scope for personal uploads that should not be visible to teammates.
  """
  User
  """
  Asset is shared within a team. Any team member can read non-avatar assets stored under
  this scope. Team avatars (assetType = "picture", not yet implemented) are visible to all
  users. The scopeKey must be a teamId that the caller belongs to.
  Use this scope for files uploaded in the context of a team meeting or team workspace.
  """
  Team
  """
  Asset is shared within an organization. Any member of the organization can read
  non-avatar assets stored under this scope. Org avatars (assetType = "picture") and IdP
  metadata files are publicly readable. Parabol-seeded assets live under the special
  "aGhostOrg" org and are visible to all users.
  The scopeKey must be an orgId that the caller belongs to.
  Use this scope for org-wide resources such as template illustrations or branding assets.
  """
  Organization
}

"""
The Atlassian (Jira Cloud) OAuth integration for a specific user on a specific Parabol team.
Stores the OAuth tokens and account linkage needed to read and write Jira issues on behalf of
the user. One record exists per (team, user) pair. Use this type to determine whether a team
member has connected Jira, to retrieve their accessible Jira projects, and to fetch or search
Jira issues for display in Parabol meetings (e.g. Sprint Poker estimation).
"""
type AtlassianIntegration {
  """
  Composite primary key in the format "atlassian:teamId:userId". Use this to uniquely
  identify a single user's Atlassian integration within a specific Parabol team.
  """
  id: ID!
  """
  Whether the stored OAuth tokens are still valid and the integration is usable. Becomes
  false when the user revokes access in Atlassian, the refresh token expires, or the
  integration is explicitly disconnected. Check this before attempting any Jira operations.
  """
  isActive: Boolean!
  """
  A short-lived Atlassian OAuth 2.0 access token (valid for ~1 hour) that can be used to
  call the Atlassian REST API directly. Only returned when the requesting viewer is the
  owner of this integration; null otherwise or when no token is available. Do not cache
  this value — treat it as ephemeral.
  """
  accessToken: ID
  """
  The Atlassian account ID (e.g. "5b10a2844c20165700ede21g") of the user who authorized
  the integration. This is the Atlassian-side identifier and can be used in Jira API calls
  to reference the user.
  """
  accountId: ID!
  """
  The list of Atlassian cloud site IDs (e.g. "your-domain.atlassian.net" instance IDs) that
  the user has granted Parabol access to. A user may have multiple Atlassian organizations;
  this list scopes which ones are available. Required when constructing Atlassian API URLs,
  which are of the form https://api.atlassian.com/ex/jira/{cloudId}/...
  """
  cloudIds: [ID!]!
  """
  Timestamp when this integration record was first created, i.e. when the user first
  connected their Atlassian account to this Parabol team.
  """
  createdAt: DateTime!
  """
  The Parabol team ID that this integration belongs to. The integration is scoped to a
  single team — the same Atlassian account connected to two different teams creates two
  separate AtlassianIntegration records.
  """
  teamId: ID!
  """
  Timestamp when the OAuth tokens were last refreshed or the integration record was last
  modified. Useful for determining how recently the integration was active.
  """
  updatedAt: DateTime!
  """
  The Parabol user ID of the person who owns this integration. Together with teamId, this
  uniquely identifies the integration. Only that user can see sensitive fields like
  accessToken.
  """
  userId: ID!
  """
  All Jira projects accessible to this user across all connected Atlassian cloud sites.
  Fetched in real time from the Atlassian API. Returns an empty list if the viewer is not
  the owner of this integration, or if the user has no accessible projects. Use this to
  populate project pickers when the user is adding a Jira issue to a Parabol meeting.
  """
  projects: [JiraRemoteProject!]!
  """
  The user's recent Jira search queries, ordered from most recently used to oldest.
  Only includes queries used within the last 60 days. Use this to populate a
  "recent searches" dropdown so the user can quickly repeat previous searches.
  """
  jiraSearchQueries: [JiraSearchQuery!]!
  """
  A paginated list of Jira issues fetched live from the Jira API for this team member.
  Returns an empty connection if the viewer is not the owner of this integration.
  Use this to let users search for and select Jira issues to bring into a Parabol meeting.
  """
  issues(
    """Maximum number of issues to return per page. Defaults to 100."""
    first: Int = 100
    """
    Pagination cursor — the value of endCursor from a previous page's pageInfo. Omit to
    start from the beginning.
    """
    after: String
    """
    A plain-text search string (matched against issue summary and description) or a full
    JQL query string when isJQL is true. Omit or pass an empty string to return all issues
    the user can access.
    """
    queryString: String
    """
    Set to true when queryString contains a JQL expression (Jira Query Language), which
    allows advanced filtering by project, assignee, status, sprint, etc. Set to false for
    simple keyword search.
    """
    isJQL: Boolean!
    """
    Optional list of Jira project keys (e.g. ["ENG", "INFRA"]) to restrict results to
    specific projects. When omitted, issues from all accessible projects are returned.
    """
    projectKeyFilters: [ID!]
  ): JiraIssueConnection!
}

"""
An authentication strategy linked to a Parabol user account. A user may have multiple identities (e.g. both a local password and a Google SSO login). Concrete implementations are AuthIdentityLocal, AuthIdentityGoogle, and AuthIdentityMicrosoft. Use the type field to discriminate between them.
"""
interface AuthIdentity {
  """
  true if the email address associated with this identity has been verified by the provider, false if verification is still pending. For Google and Microsoft identities this is always true because the OAuth provider guarantees it; for local (email/password) identities it reflects whether the user has clicked the verification link.
  """
  isEmailVerified: Boolean!
  """
  Discriminator that identifies which concrete identity type this is (LOCAL, GOOGLE, or MICROSOFT). Use this to determine whether to cast to AuthIdentityLocal, AuthIdentityGoogle, or AuthIdentityMicrosoft when you need provider-specific fields such as the OAuth provider ID.
  """
  type: AuthIdentityTypeEnum!
}

"""
An authentication identity backed by Google OAuth. A user account may have this identity if they signed up or linked their account via "Sign in with Google". Use this type (via the AuthIdentity interface) to distinguish Google-authenticated users from those using local passwords or Microsoft OAuth.
"""
type AuthIdentityGoogle implements AuthIdentity {
  """
  true if the email address associated with this Google identity has been verified by Google, else false. Google accounts are almost always verified; check this before trusting the email for sensitive operations.
  """
  isEmailVerified: Boolean!
  """
  The authentication strategy discriminator. Always GOOGLE for this type. Use this field when you need to branch logic based on how the user authenticates (e.g. to show the correct "sign in with" button or to filter identities by provider).
  """
  type: AuthIdentityTypeEnum!
  """
  The unique Google account ID (the "sub" claim from Google's ID token) for this identity. Use this to correlate the Parabol user with a specific Google account, or to look up the identity when a user has multiple auth strategies on their account.
  """
  id: ID!
}

"""
An authentication identity backed by a locally-stored email address and hashed
password. This is the classic username/password login strategy. Use this type
(rather than AuthIdentityGoogle or AuthIdentityMicrosoft) when the user signed
up via Parabol's own registration form and authenticates without an external
OAuth provider.
"""
type AuthIdentityLocal implements AuthIdentity {
  """
  true if the user has confirmed ownership of the email address (e.g. by
  clicking a verification link), false if the address is still unconfirmed.
  Unverified users may have restricted access to certain features.
  """
  isEmailVerified: Boolean!
  """
  Discriminator that identifies this as the LOCAL authentication strategy.
  Always LOCAL for this type. Use this field to distinguish AuthIdentityLocal
  from other AuthIdentity implementations (GOOGLE, MICROSOFT) when working
  with a union or interface value.
  """
  type: AuthIdentityTypeEnum!
}

"""
An authentication strategy that uses a Microsoft account (Azure AD / Microsoft Entra ID) to verify a user's identity. Present on a user when they have linked or signed in with Microsoft OAuth. Use this type when distinguishing Microsoft-authenticated users from those using Google or local (email + password) auth.
"""
type AuthIdentityMicrosoft implements AuthIdentity {
  """
  True if Microsoft has verified the email address associated with this identity, false otherwise. Microsoft OAuth accounts are typically verified, but this should be checked before treating the email as trusted.
  """
  isEmailVerified: Boolean!
  """
  The authentication strategy discriminator. Always MICROSOFT for this type. Useful when iterating over a user's AuthIdentity list to filter or branch on the specific strategy.
  """
  type: AuthIdentityTypeEnum!
  """
  The unique identifier assigned by Microsoft (the Azure AD object ID or subject claim) for this user's Microsoft account. Use this to correlate the Parabol user with their Microsoft identity without relying on email address.
  """
  id: ID!
}

"""
The authentication strategy used to verify a user's identity. Each user account may have multiple linked identities of different types. Use this to determine how a user logs in and what credentials they manage.
"""
enum AuthIdentityTypeEnum {
  """
  Email and password authentication managed by Parabol. The user registered with an email address and a hashed password stored in Parabol's own database. Supports email verification, password reset flows, and is the only identity type where the user controls a password directly in Parabol.
  """
  LOCAL
  """
  OAuth 2.0 authentication via Google Sign-In. The user logs in through Google and Parabol receives a verified Google ID token. No password is stored; the user's email verification status is sourced from Google.
  """
  GOOGLE
  """
  OAuth 2.0 authentication via Microsoft (Azure AD / Entra ID). The user logs in through Microsoft and Parabol receives a verified Microsoft ID token. Includes a tenant ID (tid) that identifies the user's Microsoft organization, enabling tenant-scoped SSO enforcement.
  """
  MICROSOFT
}

"""
A replacement auth token pushed to the client over the notification subscription when the server issues a new JWT on behalf of the viewer. This happens whenever the server-side token state diverges from what the client holds — most commonly after the viewer joins or is removed from a team, which changes the list of team IDs (tms) embedded in the token. Upon receiving this payload the client must replace its stored JWT with the new one and use it for all subsequent requests.
"""
type AuthTokenPayload {
  """
  The newly-issued JWT, encoded and unsigned, that the client should store and attach to future requests. Decoding this token exposes standard JWT claims (sub, iat, exp, iss, aud, jti) plus Parabol-specific claims: tms (array of team IDs the viewer belongs to), rol (optional elevated role such as 'su' or 'impersonate'), bet (present when the viewer is a beta tester), and scope (optional OAuth-style permission scopes).
  """
  id: ID!
}

"""
The result of the autogroup mutation, which applies AI-suggested reflection groupings to a retrospective meeting. Returns AutogroupSuccess on success or ErrorPayload if something went wrong (e.g. meeting not found, not a retrospective, or no AI suggestions available yet).
"""
union AutogroupPayload = ErrorPayload | AutogroupSuccess

"""
A single AI-generated reflection group proposed by OpenAI during a retrospective meeting.
Produced by the autogroup mutation, which calls OpenAI to cluster a meeting's reflections
into thematically similar groups and gives each cluster a descriptive title.
This type is used in two places on RetrospectiveMeeting:
  - autogroupReflectionGroups: the current AI-suggested grouping
  - resetReflectionGroups: a snapshot of the grouping that existed before autogroup ran,
    used to restore the original arrangement if the facilitator rejects the AI suggestion.
"""
type AutogroupReflectionGroup {
  """
  The AI-generated display title summarising the theme shared by the reflections in this group.
  Produced by OpenAI based on the text content of the reflections and the prompt question they answered.
  """
  groupTitle: String!
  """
  The IDs of the RetroReflection records assigned to this group.
  Use these IDs to look up the full reflection objects and render the group's cards.
  """
  reflectionIds: [ID!]!
}

"""
Returned when the autogroup mutation succeeds. The mutation uses OpenAI to cluster
retrospective reflections into thematically similar groups and rearranges them
accordingly. The meeting's autogroupReflectionGroups field holds the AI-suggested
groupings, and resetReflectionGroups is snapshot of the groups before grouping so
the facilitator can undo via resetReflectionGroups mutation.
"""
type AutogroupSuccess {
  """
  The retrospective meeting whose reflections were just regrouped by AI. Fetch
  autogroupReflectionGroups on this meeting to see the AI-suggested clusters, or
  resetReflectionGroups to see the snapshot that was saved so the grouping can be undone.
  """
  meeting: RetrospectiveMeeting!
}

"""
Represents a single team member's Azure DevOps integration, including their OAuth2 credentials,
the ADO instances they have access to, and helpers for querying work items and projects. One record
exists per (team, user) pair. Use this type to fetch ADO work items for display in Parabol (e.g.
linking a task to an ADO work item during a meeting) or to surface the member's available ADO
projects and saved search queries.
"""
type AzureDevOpsIntegration {
  """
  The OAuth2 access and refresh tokens for this team member's Azure DevOps connection. Null when
  the user has not yet authorized Parabol to access their ADO account, or when the token has been
  revoked. Check this field before attempting to fetch work items or projects.
  """
  auth: TeamMemberIntegrationAuthOAuth2
  """
  Composite primary key in the format "ado:{teamId}:{userId}". Uniquely identifies this integration
  record across all teams and users.
  """
  id: ID!
  """
  The Azure DevOps account (organization-level) ID associated with this integration. Corresponds to
  the ADO organization that owns the instances the user granted access to.
  """
  accountId: ID!
  """
  The list of Azure DevOps instance (organization) IDs the user has explicitly granted Parabol
  access to. Each entry is an ADO organization URL slug or ID. Use this to scope API requests to
  only the instances the user has authorized.
  """
  instanceIds: [ID!]!
  """
  The timestamp when this integration record was first created, i.e. when the user first connected
  their ADO account to this Parabol team.
  """
  createdAt: DateTime!
  """
  The Parabol team ID this integration belongs to. An ADO integration is always scoped to a single
  team — the same ADO account can be connected to multiple teams, each producing a separate record.
  """
  teamId: ID!
  """
  The timestamp when this integration record was last updated, e.g. when the OAuth token was
  refreshed or when the user updated their authorized instances.
  """
  updatedAt: DateTime!
  """
  The Parabol user ID of the team member who owns this integration. Combined with teamId, this
  uniquely identifies the integration.
  """
  userId: ID!
  """
  A paginated list of Azure DevOps work items fetched live from the ADO API for this team member.
  Use this field to search for work items to link to a Parabol task or meeting agenda item. Supports
  free-text search or full WIQL (Work Item Query Language) for advanced filtering. Results are
  ordered by most recently updated first.
  """
  workItems(
    """
    Maximum number of work items to return. Defaults to 100. Use with `after` for pagination.
    """
    first: Int = 100
    """
    An ISO8601 datetime cursor for pagination. Pass the `endCursor` from a previous page's
    `pageInfo` to retrieve the next page of results.
    """
    after: DateTime
    """
    A plain-text search string, or a full WIQL query string if `isWIQL` is true. When plain text,
    the ADO API performs a full-text search against work item titles and descriptions. Leave null or
    empty to return the most recently updated items without filtering.
    """
    queryString: String
    """
    An optional list of ADO project IDs or names to restrict the search to. Pass an empty array or
    omit filtering to search across all projects the user has access to within their authorized
    instances.
    """
    projectKeyFilters: [String!]!
    """
    Set to true when `queryString` contains a WIQL (Work Item Query Language) expression, which
    allows advanced filtering by any work item field. Set to false (or omit) for a simple
    full-text keyword search.
    """
    isWIQL: Boolean!
  ): AzureDevOpsWorkItemConnection!
  """
  The complete list of Azure DevOps projects the team member has access to across all of their
  authorized instances. Use this to populate a project picker so the user can filter work item
  searches by project.
  """
  projects: [AzureDevOpsRemoteProject!]!
  """
  The global (cloud-level) OAuth2 integration provider for Azure DevOps configured via Parabol
  environment variables. This is the system-wide ADO provider available to all teams. Null when
  no cloud ADO provider has been configured in the environment (i.e. the ADO integration is
  disabled at the instance level).
  """
  cloudProvider: IntegrationProviderOAuth2
  """
  OAuth2 integration providers for Azure DevOps that have been shared at the team or organization
  level (as opposed to the global cloud provider). These are custom ADO provider configurations an
  admin has made available to specific teams. Use this list alongside `cloudProvider` to show the
  user all available ADO providers they can authorize against.
  """
  sharedProviders: [IntegrationProviderOAuth2!]!
  """
  The team member's saved Azure DevOps search queries, sorted by most recently used. Only queries
  used within the last 60 days are included. Use this to populate a "recent searches" UI so the
  user can quickly re-run a previous work item search without retyping their query or filters.
  """
  azureDevOpsSearchQueries: [AzureDevOpsSearchQuery!]!
}

"""
A Team Project fetched live from the Azure DevOps REST API. Implements RepoIntegration so it
can appear alongside Jira, GitHub, and other repo integrations in project-picker UIs. Use this
type when you need project-level metadata (name, state, visibility) to let a user select which
Azure DevOps project to link work items against, or when you need to navigate from a work item
back to its parent project.
"""
type AzureDevOpsRemoteProject implements RepoIntegration {
  """
  Globally unique identifier for this project within Parabol, composed as
  instanceId:projectId (e.g. "dev.azure.com/myorg:abc123"). Use this when
  referencing the project in mutations or as a cache key.
  """
  id: ID!
  """
  Always "azureDevOps". Identifies the integration provider so clients can
  route this RepoIntegration to the correct handler.
  """
  service: IntegrationProviderServiceEnum!
  """
  The Parabol team ID on whose behalf this project was fetched. Used to scope
  the result to the correct team context.
  """
  teamId: ID!
  """
  The Parabol user ID on whose behalf this project was fetched. The OAuth
  token belonging to this user was used to make the Azure DevOps API request.
  """
  userId: ID!
  """
  Timestamp of the most recent change to this project in Azure DevOps, as
  returned by the API. Useful for sorting or detecting stale data.
  """
  lastUpdateTime: DateTime!
  """
  The Azure DevOps REST API URL for this project's own resource endpoint
  (the href from _links.self). Use this to make direct API calls or to
  construct deep links into the Azure DevOps UI.
  """
  self: ID!
  """
  The Azure DevOps organization instance hostname, e.g. "dev.azure.com/myorg".
  Combined with the project name or ID this uniquely identifies the project
  across all Azure DevOps organizations the user has access to.
  """
  instanceId: ID!
  """
  The human-readable display name of the Team Project in Azure DevOps, e.g.
  "MyApp Backend". Show this in project-picker dropdowns and task detail views.
  """
  name: String!
  """
  A monotonically increasing integer that Azure DevOps increments each time
  the project's metadata is updated. Useful for detecting whether locally
  cached project data is out of date compared to the remote.
  """
  revision: Int!
  """
  The lifecycle state of the project as reported by Azure DevOps. Common
  values are "wellFormed" (active and fully provisioned), "createPending",
  "deleting", "deleted", and "new". Only "wellFormed" projects are fully
  usable for creating and querying work items.
  """
  state: String!
  """
  The Azure DevOps REST API URL for this project, e.g.
  "https://dev.azure.com/myorg/_apis/projects/abc123". Can be used to fetch
  further project details directly from the Azure DevOps API.
  """
  url: String!
  """
  Access visibility of the project within Azure DevOps. Either "private"
  (accessible only to members) or "public" (accessible to anyone). Surfaces
  in the UI when helping users understand who can see linked work items.
  """
  visibility: String!
}

"""
A saved Azure DevOps work-item search query, capturing the query string and any
filters that were active when the query was last run. These are persisted per-user
so that recently used searches can be surfaced and re-executed quickly during
sprint planning or issue scoping.
"""
type AzureDevOpsSearchQuery {
  """A short unique identifier for this saved search query."""
  id: ID!
  """
  The search string used to find work items. When isWIQL is false this is a
  plain-text keyword search; when isWIQL is true this is a full WIQL (Work Item
  Query Language) statement, which supports WHERE clauses, field comparisons, and
  ordering (e.g. "SELECT [Id] FROM WorkItems WHERE [System.State] = 'Active'").
  """
  queryString: String!
  """
  An optional list of Azure DevOps project keys (slugs) used to narrow results to
  specific projects. An empty array means the query runs across all projects the
  user has access to. Each entry corresponds to an Azure DevOps project name or ID.
  """
  projectKeyFilters: [String!]!
  """
  When true, queryString must be a valid WIQL statement and will be sent to the
  Azure DevOps WIQL endpoint directly. When false, queryString is treated as a
  simple keyword search and project-level filters are applied separately.
  """
  isWIQL: Boolean!
  """
  The timestamp of the most recent time this query was executed. Used to sort saved
  queries so the most recently used ones appear first in the UI.
  """
  lastUsedAt: DateTime!
}

"""
An Azure DevOps work item fetched in real time from the Azure DevOps REST API.
Implements TaskIntegration, meaning a Parabol Task can be linked to this work item
so that changes (e.g. title, state) are reflected back to Azure DevOps.
Use this type when displaying, linking, or syncing a specific work item inside a Parabol task or retro card.
"""
type AzureDevOpsWorkItem implements TaskIntegration {
  """
  Globally unique identifier for this work item within Parabol, formed by joining the Azure DevOps
  instance ID, the team project name/ID, and the numeric work item ID with colons:
  "<instanceId>:<teamProject>:<issueKey>" (e.g. "a1b2c3.visualstudio.com:MyProject:42").
  Use this as the stable reference when storing or querying the work item inside Parabol.
  """
  id: ID!
  """
  The direct browser URL to open this work item in Azure DevOps
  (e.g. "https://dev.azure.com/org/MyProject/_workitems/edit/42").
  Use this to link users directly to the work item in the Azure DevOps UI.
  """
  url: String!
  """
  The numeric work item ID assigned by Azure DevOps (e.g. "42").
  This is the raw ID as it appears in Azure DevOps, without any project or instance prefix.
  Use this when displaying the work item reference or constructing Azure DevOps API calls.
  """
  issueKey: String!
  """
  The human-readable title (name) of the work item, equivalent to the "Title" field in Azure DevOps.
  Use this for display purposes wherever a short label for the work item is needed.
  """
  title: String!
  """
  The name or ID of the Azure DevOps Team Project that owns this work item
  (e.g. "MyProject"). Team Projects are the top-level organizational unit inside an Azure DevOps instance.
  Use this to scope API calls or to display which project the work item belongs to.
  """
  teamProject: String!
  """
  The full AzureDevOpsRemoteProject record for the team project that owns this work item.
  Provides richer project metadata (instance ID, visibility, revision, etc.) beyond the plain teamProject name.
  Use this when you need project-level details alongside the work item, such as constructing links or
  validating access.
  """
  project: AzureDevOpsRemoteProject!
  """
  The current workflow state of the work item as defined in Azure DevOps (e.g. "Active", "Resolved", "Closed").
  The available states depend on the work item type and the process template configured for the project.
  Use this to show progress, filter by status, or decide whether a task should be marked complete in Parabol.
  """
  state: String!
  """
  The work item type as defined in Azure DevOps (e.g. "Bug", "User Story", "Task", "Epic").
  The available types depend on the process template (Agile, Scrum, CMMI) configured for the project.
  Use this to display the correct icon/label or to differentiate handling between bugs and stories.
  """
  type: String!
  """
  The work item's description field rendered as an HTML string.
  Azure DevOps stores descriptions as HTML; this field exposes that HTML directly so it can be
  rendered in a rich-text context. May be an empty string if the work item has no description.
  Use this when showing a preview of the work item's details inside Parabol (e.g. in a task drawer).
  """
  descriptionHTML: String!
}

"""
A Relay-style paginated connection for Azure DevOps work items fetched from a user's Azure DevOps integration. Use this type when listing work items to import as Parabol tasks or when searching for work items to link to a task. Pagination is cursor-based using ISO8601 date cursors. Check the error field before iterating edges — if the integration is misconfigured or the request fails, edges will be empty and error will explain why.
"""
type AzureDevOpsWorkItemConnection {
  """
  Pagination metadata for this page of results. Use the cursors here to fetch the next or previous page of work items.
  """
  pageInfo: PageInfoDateCursor
  """
  The list of work item edges on this page. Each edge wraps a single AzureDevOpsWorkItem node and a cursor that can be used to resume pagination from that position.
  """
  edges: [AzureDevOpsWorkItemEdge!]!
  """
  Present when the connection could not be loaded, for example when the Azure DevOps integration is missing, the access token has expired, or the requested project does not exist. When this field is non-null, edges will be empty and pageInfo will be absent.
  """
  error: StandardMutationError
}

"""
A pagination edge wrapping a single Azure DevOps work item in a cursor-based connection.
Use this type when iterating over a paginated list of work items returned from AzureDevOpsWorkItemConnection.
Each edge pairs the work item node with a cursor that marks its position in the result set,
allowing subsequent queries to resume from that point using the cursor as a pagination argument.
"""
type AzureDevOpsWorkItemEdge {
  """
  The Azure DevOps work item at this position in the paginated result set.
  """
  node: AzureDevOpsWorkItem!
  """
  An opaque ISO8601 DateTime cursor representing this edge's position in the connection.
  Pass this value as the `after` argument on the parent connection query to fetch the next page of results starting after this work item.
  Null if the work item has no associated timestamp for ordering.
  """
  cursor: DateTime
}

"""
The result of the batchArchiveTasks mutation. Returns BatchArchiveTasksSuccess when at least the
archive operation completes (even if some tasks were skipped due to permission checks), or
ErrorPayload if the operation could not proceed at all (e.g. authentication failure).
"""
union BatchArchiveTasksPayload = ErrorPayload | BatchArchiveTasksSuccess

"""
Returned when batchArchiveTasks succeeds. Contains only the tasks that were
actually archived — tasks the viewer lacked permission to archive (neither the
task creator nor a member of the task's team) are silently excluded from both
lists.
"""
type BatchArchiveTasksSuccess {
  """
  IDs of the tasks that were successfully archived. May be a subset of the
  input taskIds if the viewer did not have permission to archive every requested
  task.
  """
  archivedTaskIds: [ID!]
  """
  Full Task objects for every successfully archived task. Populated when the
  caller needs task details beyond IDs (e.g. to update local UI state). Null
  when the resolver returns only IDs via the team subscription broadcast.
  """
  archivedTasks: [Task!]
}

"""
The type of entity to check access for, used as an argument to User.canAccess.
Lets callers determine whether the viewer has permission to see a specific resource
(e.g. to distinguish a "not found" error from an "invite required" situation).
"""
enum CanAccessEntity {
  """
  A team the viewer may or may not be a member of. Use to check whether the viewer
  can see team details before prompting them to request membership.
  """
  Team
  """
  A meeting (retrospective, standup, poker, etc.) that may be restricted to team members.
  Use to determine whether the viewer needs an invite link to join.
  """
  Meeting
  """
  An organization the viewer may or may not belong to. Use to check visibility before
  directing the viewer to request access or an invitation.
  """
  Organization
}

"""
Identifies how a change to a record was initiated. Used on TaskEstimate to distinguish
whether a story-point estimate was set during a poker planning meeting, updated directly
on the task outside of a meeting, or synchronized in from an external integration such
as Jira or Azure DevOps.
"""
enum ChangeSourceEnum {
  """
  The change was made during a Parabol poker planning meeting (Sprint Poker). Use this
  value when an estimate is recorded as the outcome of a team vote in a meeting stage.
  """
  meeting
  """
  The change was made directly on the task itself, outside of any meeting context. Use
  this value when a user edits an estimate from the task detail view or task list.
  """
  task
  """
  The change originated from an external integration, such as a Jira or Azure DevOps
  webhook or sync. Use this value when the estimate was pushed into Parabol by a
  third-party service rather than by a user action within the app.
  """
  external
}

"""
Returned by the changeTaskTeam mutation, which reassigns a task from one team to another.
Contains the updated task for members of the new team, an error if the operation failed,
and the removed task ID for users who are no longer permitted to see the task after the move.
"""
type ChangeTaskTeamPayload {
  """
  Present when the mutation fails; describes what went wrong so the client can surface an error message.
  """
  error: StandardMutationError
  """
  The task after being reassigned to the new team, including any updated team-scoped fields.
  Null if the viewer is not a member of the new team (use removedTaskId instead).
  """
  task: Task
  """
  The ID of the task that was moved, sent only to viewers who are not members of the new team.
  Clients should use this to evict the task from their local store when they receive this payload.
  """
  removedTaskId: ID
}

"""
The icebreaker phase that opens Action and Retrospective meetings. Each team member gets their own CheckInStage and responds to a shared question of the week before the substantive meeting work begins. The phase includes a rotating multilingual greeting and a randomly-selected icebreaker question, both seeded by the team ID and meeting count so they vary across meetings.
"""
type CheckInPhase implements NewMeetingPhase {
  """Unique identifier for this phase instance (shortid)"""
  id: ID!
  """The ID of the meeting this phase belongs to"""
  meetingId: ID!
  """The ID of the team running this meeting"""
  teamId: ID!
  """The type of phase — always 'checkin' for this type"""
  phaseType: NewMeetingPhaseTypeEnum!
  """
  One stage per team member, ordered by team member position. Each stage represents a single team member's turn to answer the check-in question. Iterate these to show progress through the phase or to render each member's check-in turn.
  """
  stages: [CheckInStage!]!
  """
  A randomly-selected greeting in a non-English language, shown at the top of the check-in phase to add a fun, multicultural touch. Rotates each meeting based on the team ID and meeting count. Use this to display the opening greeting word alongside its source language.
  """
  checkInGreeting: MeetingGreeting!
  """
  The icebreaker question posed to every team member during check-in, stored as a stringified TipTap JSON document. Rotates each meeting based on the team ID and meeting count. Parse and render this with a TipTap-compatible renderer. The trailing "?" is typically appended by the UI component.
  """
  checkInQuestion: String!
}

"""
A single stage within the check-in phase of an Action meeting, scoped to one team member. The check-in phase contains one CheckInStage per team member, and the facilitator advances through them sequentially. Each stage presents the check-in question to the focused team member, who answers before the meeting moves on. Use this type when you need to inspect or display the per-member check-in status, readiness, or timing within a meeting.
"""
type CheckInStage implements NewMeetingStage & NewMeetingTeamMemberStage {
  """stageId, shortid"""
  id: ID!
  """The datetime the stage was completed"""
  endAt: DateTime
  """foreign key. try using meeting"""
  meetingId: ID!
  """The meeting this stage belongs to"""
  meeting: NewMeeting!
  """
  true if the facilitator has completed this stage, else false. Should be boolean(endAt)
  """
  isComplete: Boolean!
  """true if any meeting participant can navigate to this stage"""
  isNavigable: Boolean!
  """true if the facilitator can navigate to this stage"""
  isNavigableByFacilitator: Boolean!
  """The phase this stage belongs to"""
  phase: NewMeetingPhase
  """The type of the phase"""
  phaseType: NewMeetingPhaseTypeEnum
  """The datetime the stage was started"""
  startAt: DateTime
  """Number of times the facilitator has visited this stage"""
  viewCount: Int
  """
  true if a time limit is set, false if end time is set, null if neither is set
  """
  isAsync: Boolean
  """true if the viewer is ready to advance, else false"""
  isViewerReady: Boolean!
  """User ids of those who are ready to advance to the next stage"""
  readyUserIds: [ID!]!
  """
  The datetime the phase is scheduled to be finished, null if no time limit or end time is set
  """
  scheduledEndTime: DateTime
  """
  The suggested ending datetime for a phase to be completed async, null if not enough data to make a suggestion
  """
  suggestedEndTime: DateTime
  """
  The suggested time limit for a phase to be completed together, null if not enough data to make a suggestion
  """
  suggestedTimeLimit: Float
  """
  The id of the team this stage belongs to. Useful for scoping queries without fetching the full meeting.
  """
  teamId: ID!
  """
  The number of milliseconds left before the scheduled end time. Useful for unsynced client clocks. null if scheduledEndTime is null
  """
  timeRemaining: Float
  """
  The 0-based position of this stage within its phase, ordered by sortOrder.
  """
  stageIdx: Int!
  """The meeting member that is the focus for this phase item"""
  meetingMember: MeetingMember!
  """foreign key. use teamMember"""
  teamMemberId: ID!
  """The team member that is the focus for this phase item"""
  teamMember: TeamMember!
}

"""
A comment posted in a discussion thread. Comments can be top-level posts or replies to other
Threadable items (including other Comments). They support emoji reactions via the Reactable
interface and can be posted anonymously. When a comment is deleted its content is replaced
with tombstone text but the record is retained (isActive becomes false) so that reply
threading is preserved.
"""
type Comment implements Reactable & Threadable {
  """Unique short ID for this comment."""
  id: ID!
  """
  The rich-text (Prosemirror JSON serialised as a string) body of the comment. When the
  comment has been deleted (isActive is false) this contains tombstone placeholder text
  rather than the original content.
  """
  content: String!
  """The timestamp when this comment was first created."""
  createdAt: DateTime!
  """
  The ID of the user who created this comment. Null when the comment was posted anonymously
  (isAnonymous is true).
  """
  createdBy: ID
  """
  The full User object for the comment author. Null when the comment was posted anonymously
  (isAnonymous is true). Prefer this over createdBy when you need to display author details.
  """
  createdByUser: User
  """
  All direct replies to this comment, returned as an ordered list of Threadable items.
  An empty array means no one has replied yet.
  """
  replies: [Threadable!]!
  """
  The ID of the Discussion thread this comment belongs to. Null if the comment was not
  created inside a discussion (e.g. it was created on a Task directly).
  """
  discussionId: ID
  """
  The ID of the parent Threadable item when this comment is a reply. Null when this comment
  is a top-level post in the thread rather than a reply.
  """
  threadParentId: ID
  """
  Numeric sort key that determines the display order of this comment relative to its siblings
  that share the same threadParentId. Lower values appear first.
  """
  threadSortOrder: Int
  """
  The timestamp when this comment was last modified (e.g. content edited or reactions changed).
  """
  updatedAt: DateTime!
  """
  The emoji reactions that have been added to this comment, grouped by emoji so each entry
  represents one distinct reactji and includes how many users reacted with it.
  """
  reactjis: [Reactji!]!
  """
  False when the comment has been soft-deleted. Soft-deleted comments retain their record
  so that reply threading is not broken, but their content is replaced with tombstone text.
  """
  isActive: Boolean!
  """
  True when the comment was posted anonymously. When true, createdBy and createdByUser are
  null and the author's identity must not be surfaced in the UI.
  """
  isAnonymous: Boolean!
  """
  True when the currently authenticated viewer is the author of this comment. Use this to
  conditionally show edit and delete controls.
  """
  isViewerComment: Boolean!
}

"""
A lightweight snapshot of a user who is actively commenting on a retro reflection group thread.
Contains only the identity fields needed to display a commenter indicator, rather than the full User type.
Note: this type is deprecated on RetroReflectionGroup — commentor presence has moved to ThreadConnection.
"""
type CommentorDetails {
  """
  The userId of the person commenting. Matches the id field on the User type and can be used to fetch the full user record if more details are needed.
  """
  id: ID!
  """
  The display name the user has chosen (e.g. "Jane Smith"). Use this to label the commenter in the UI without needing a separate User lookup.
  """
  preferredName: String!
}

"""
A Company groups one or more Organizations that share the same top-level domain (e.g. "acme.com").
It is created and maintained automatically — whenever a user joins or creates an Organization,
Parabol extracts the TLD from their email address and associates that Organization with the
matching Company. Use Company when you need aggregate metrics (usage, billing tier, engagement)
across every Organization that belongs to the same corporate entity.
"""
type Company {
  """
  The top-level domain that uniquely identifies this company (e.g. "acme.com").
  Derived from user email addresses and used as the primary key.
  """
  id: ID!
  """
  The total number of non-archived teams that are currently active across all
  Organizations belonging to this company.
  """
  activeTeamCount: Int!
  """
  The number of distinct users who are members of at least one Organization in
  this company and are not marked inactive. Pass `after` to restrict the count
  to users who joined after a specific point in time — useful for measuring
  recent growth.
  """
  activeUserCount(
    """
    When provided, only users whose Organization membership began after this
    timestamp are counted. Omit to count all non-inactive members.
    """
    after: DateTime
  ): Int!
  """
  The number of Organizations within this company that are considered "active":
  they must have at least one non-archived team and at least two team members
  who have logged in within the last 30 days.
  """
  activeOrganizationCount: Int!
  """
  The timestamp of the most recently started meeting across every team in every
  Organization belonging to this company. Returns null if no meetings have ever
  been run.
  """
  lastMetAt: DateTime
  """
  The total number of meetings that have been started across all teams in all
  Organizations belonging to this company. Pass `after` to count only meetings
  created on or after that timestamp.
  """
  meetingCount(
    """
    When provided, only meetings created on or after this timestamp are counted.
    """
    after: DateTime
  ): Int!
  """
  The longest streak (in consecutive calendar months) during which at least one
  team in the company ran a meeting every month. A streak resets if any calendar
  month passes without a completed meeting. Useful as an engagement health signal.
  """
  monthlyTeamStreakMax: Int!
  """
  All Organizations that belong to this company. The list is visibility-scoped:
  enterprise-tier members and super-users see every Organization; other members
  see only the Organizations they personally belong to.
  """
  organizations: [Organization!]!
  """
  The highest billing tier that any organization user across this company has been
  nudged to upgrade to, based on their `suggestedTier` field. Returns null if no
  upgrade nudge is in effect. "starter" means no upgrade is suggested; "team" or
  "enterprise" indicates the recommended next tier. This drives upsell prompts in
  the UI — use `tier` instead if you want the current paid tier rather than the
  suggested one.
  """
  suggestedTier: TierEnum
  """
  The highest billing tier currently active across all Organizations in this
  company. Determined by inspecting each Organization's `tier` field and
  returning the highest value ("enterprise" > "team" > "starter"). Use this
  to determine what features the company already has access to.
  """
  tier: TierEnum!
  """
  The total number of distinct users who are members of at least one
  Organization in this company, regardless of activity or join date.
  """
  userCount: Int!
}

"""
The format in which an AI-generated string response should be returned.
Use this to control how the client will render the content — choose html if the
response will be injected directly into the DOM, or markdown if the client will
parse/render Markdown syntax (e.g. inside a Markdown renderer or plain-text
display). Defaults to markdown in most AI query fields.
"""
enum ContentFormatEnum {
  """
  The response is returned as an HTML string. Use when the caller will render
  the content directly in the DOM without an intermediate Markdown parser,
  e.g. setting innerHTML or using dangerouslySetInnerHTML in React.
  """
  html
  """
  The response is returned as a Markdown-formatted string. This is the default.
  Use when the caller will pass the content to a Markdown renderer or display
  it as plain text where Markdown syntax is acceptable.
  """
  markdown
}

"""
Input for the addAgendaItem mutation. Describes a new agenda item to be added to a team's Check-In meeting (meetingType: "action"). Agenda items represent topics a team member wants to discuss during the AgendaItemsPhase. Items can be created before a meeting starts or while one is in progress. Pinned items are automatically re-created at the start of each subsequent meeting so recurring topics always appear on the agenda.
"""
input CreateAgendaItemInput {
  """The text description of the topic to discuss. Maximum 64 characters."""
  content: String!
  """
  When true, this agenda item will be automatically cloned and re-added to the next Check-In meeting when the current meeting ends. Use for recurring topics the team discusses every meeting. Non-pinned items are cleared when the meeting closes.
  """
  pinned: Boolean!
  """The ID of the team this agenda item belongs to."""
  teamId: ID!
  """
  The ID of the team member who is creating this agenda item (format: teamId::userId). Determines who "owns" the item in the agenda list and whose avatar appears next to it.
  """
  teamMemberId: ID!
  """
  The fractional-index sort order used to position this item in the agenda list. If omitted, the server places the item at the end of the list. Provide a value to insert the item at a specific position between existing items.
  """
  sortOrder: String
  """
  The ID of the active Check-In meeting to associate this agenda item with. If provided, the item is linked to that meeting and will appear in its agenda phase. If omitted, the item is added to the team's agenda queue and will be associated with the next meeting that starts.
  """
  meetingId: String
}

"""
Input for creating a Google Calendar event that accompanies the start of a Parabol meeting
(Sprint Poker, Check-In, Retrospective, or Team Prompt). Provide this when the caller wants
to place a calendar event on team members' calendars at the same time the meeting is created.
All time values must be consistent: startTimestamp and endTimestamp should fall within the
wall-clock day described by timeZone.
"""
input CreateGcalEventInput {
  """
  Unix timestamp (seconds since epoch) for when the calendar event starts.
  Must be earlier than endTimestamp.
  """
  startTimestamp: Int!
  """
  Unix timestamp (seconds since epoch) for when the calendar event ends.
  Must be later than startTimestamp.
  """
  endTimestamp: Int!
  """
  IANA timezone name (e.g. "America/Los_Angeles") used to display the event's
  start and end times correctly in Google Calendar for each attendee.
  """
  timeZone: String!
  """
  List of email addresses to invite as attendees on the Google Calendar event.
  Each address receives a calendar invitation. If omitted or empty, no attendees
  are added beyond the organizer.
  """
  invitees: [Email!]
  """
  The video conferencing provider to attach to the calendar event.
  Use "meet" to add a Google Meet link, or "zoom" to add a Zoom link.
  If omitted, no video conferencing link is added to the event.
  """
  videoType: GcalVideoTypeEnum
}

"""
Payload returned by the createImposterToken mutation. On success, the server sets an
auth cookie scoped to the impersonated user (role: "impersonate", valid for 5 minutes),
allowing an admin to act as that user for troubleshooting without knowing their
credentials. The token is delivered via cookie, not as a field on this type.
"""
type CreateImposterTokenPayload {
  """
  Present when the mutation fails — for example when no user matches the supplied
  userId or email. Null on success.
  """
  error: StandardMutationError
  """
  The user whose identity was assumed. Use this to confirm which account the
  impersonation session was created for before redirecting or continuing.
  """
  user: User
}

"""
Payload returned by the createOAuth1AuthorizeUrl mutation. On success, contains
the authorization URL the client should redirect the user to in order to begin
the OAuth 1.0a three-legged authorization flow. The URL already contains the
oauth_token (request token) obtained from the provider, so the client only
needs to redirect to it. On failure, error is populated and url is null.
"""
type CreateOAuth1AuthorizationURLPayload {
  """
  Present when the mutation fails (e.g. invalid providerId, provider
  unreachable, or team not found). Null on success.
  """
  error: StandardMutationError
  """
  The provider's authorization endpoint URL with the oauth_token query
  parameter already appended. Redirect the user to this URL to have them grant
  access on the provider's site. After the user approves, the provider will
  redirect back with oauth_token and oauth_verifier, which are then used in the
  subsequent step to exchange for a permanent access token. Null on error.
  """
  url: String
}

"""
The result of a successful OAuth 2.0 authorization code request. Returned
when a user approves an OAuth 2.0 authorization flow initiated via
GET /oauth/authorize. The client application exchanges the code for an
access token by POSTing to /oauth/token with grant_type=authorization_code.
"""
type CreateOAuthAPICodePayload {
  """
  A short-lived, single-use authorization code (valid for 10 minutes) that
  the OAuth client exchanges for an access token at the /oauth/token endpoint.
  This code is tied to the requesting client_id, redirect_uri, user, and
  approved scopes.
  """
  code: String!
  """
  The opaque state value originally supplied by the OAuth client in the
  authorization request. Echoed back unchanged so the client can verify
  the response matches its request and guard against CSRF attacks. Null
  when the client did not include a state parameter.
  """
  state: String
}

"""
The result of successfully creating a new OAuth 2.0 API provider. The clientSecret is only
returned here and is never stored in a retrievable form — the caller must save it immediately.
"""
type CreateOAuthAPIProviderPayload {
  """
  The newly created OAuth 2.0 provider record, containing metadata such as name, redirect URIs, and scopes. Does not include the clientSecret.
  """
  provider: OAuthAPIProvider!
  """
  The public OAuth 2.0 client identifier for this provider. Safe to share; used by third-party clients when initiating authorization flows.
  """
  clientId: String!
  """
  The secret credential for this provider. Returned only once at creation time — it is not persisted in a readable form and cannot be retrieved later. Store it securely now.
  """
  clientSecret: String!
}

"""
The payload returned by the createPage mutation. Contains the newly created top-level page.
"""
type CreatePagePayload {
  """
  The newly created page, seeded with an empty heading and ready for content.
  """
  page: Page!
}

"""
Returned when a personal access token is successfully created. The plaintext token
is only available in this response — it is never retrievable again after creation,
so callers must store it immediately. Subsequent API calls use this token for
Bearer authentication.
"""
type CreatePersonalAccessTokenSuccess {
  """
  The plaintext token value — only returned once at creation, store it securely
  """
  token: String!
  """
  The persisted metadata record for the newly created token. Use this to display
  token details (name, scopes, expiry) to the user or to reference the token by
  ID for future revocation.
  """
  personalAccessToken: PersonalAccessToken!
}

"""
Input for the createPoll mutation. Creates a new poll inside a discussion thread during a meeting.
Polls let meeting participants vote on a question with 2–4 predefined options.
The caller must be an active member of the meeting that owns the discussion.
"""
input CreatePollInput {
  """
  The ID of the discussion thread in which the poll will appear.
  Determines which meeting and team the poll belongs to.
  """
  discussionId: ID!
  """
  Numeric sort key that controls where this poll appears within its thread, relative to other threadable items (comments, tasks, polls).
  Lower values appear first. Assign a value consistent with the ordering of existing items in the thread.
  """
  threadSortOrder: Int!
  """
  The question being posed to voters. Must be between 2 and 100 characters.
  """
  title: String!
  """
  The voting options presented to participants. Must contain between 2 and 4 items (inclusive).
  Every option must have a non-empty title. The order of items in this list determines display order.
  """
  options: [PollOptionInput!]!
}

"""
The result of the createPoll mutation. Returns CreatePollSuccess when the poll is
successfully created in a meeting discussion thread, or ErrorPayload when creation
fails (e.g. the discussion does not exist, the user lacks permission, or the input
is invalid). Callers should check the __typename field to distinguish the two cases.
"""
union CreatePollPayload = ErrorPayload | CreatePollSuccess

"""
The success payload returned by the createPoll mutation. Use this type (as opposed to ErrorPayload)
when the union CreatePollPayload resolves successfully. It gives you both the stable identifier of
the newly created poll and the full Poll object so you can immediately display or interact with the
poll without a follow-up query.
"""
type CreatePollSuccess {
  """
  The stable, globally unique identifier of the newly created poll, in the format
  `poll:<database-generated-id>`. Use this ID to reference the poll in subsequent mutations
  (e.g. vote on an option) or queries without needing to traverse the full Poll object.
  """
  pollId: ID!
  """
  The fully hydrated Poll object that was just created, including its title, voting options, the
  discussion it belongs to, the team it is scoped to, and authorship metadata. Use this field to
  render the poll UI immediately after creation rather than refetching it separately.
  """
  poll: Poll!
}

"""
Input for creating a new retro reflection during the reflect phase of a retrospective meeting.
Each reflection belongs to exactly one reflect prompt (category) and is placed in its own
newly-created reflection group. Reflections can only be added before the group phase is complete.
"""
input CreateReflectionInput {
  """
  A stringified TipTap JSONContent document containing the reflection's thoughts.
  Must be 2000 characters or fewer. If omitted or null, an empty document is created.
  The server normalises legacy formats to TipTap automatically.
  """
  content: String
  """
  The ID of the retrospective meeting in which to create the reflection.
  The meeting must be active (not ended) and must not have completed the group phase yet.
  """
  meetingId: ID!
  """
  The ID of the ReflectPrompt (category) this reflection answers, e.g. "What went well?".
  Determines which column the reflection appears in on the board. Immutable after creation.
  """
  promptId: ID!
  """
  The vertical sort position of the reflection's containing group within its prompt column.
  A new ReflectionGroup is created for this reflection and placed at this position.
  Use a float so items can be inserted between existing positions without renumbering.
  """
  sortOrder: Float!
}

"""
Payload returned by the createReflection mutation.

A successful call creates one RetroReflection and a new RetroReflectionGroup that
wraps it, both persisted to the database. The meeting's group phase is also unlocked
(made navigable for the facilitator) if this is the first reflection added to the
meeting. The payload is broadcast over the MEETING subscription channel so all
participants see the new card in real time.

Failure cases surfaced via error:
- promptId does not match a known ReflectPrompt ("Category not found")
- meetingId does not match a known meeting ("Meeting not found")
- The meeting has already ended ("Meeting already ended")
- The group phase of the meeting is already complete ("Meeting phase already completed")
- content exceeds 2 000 characters ("Reflection content is too long")
"""
type CreateReflectionPayload {
  """Present when the mutation failed. Null on success."""
  error: StandardMutationError
  """
  The retrospective meeting in which the reflection was created.
  Null when error is non-null.
  """
  meeting: NewMeeting
  """
  The ID of the newly created RetroReflection. Useful for optimistic updates
  before the full reflection object is needed.
  Null when error is non-null.
  """
  reflectionId: ID
  """
  The newly created RetroReflection containing the content, promptId, and
  creator information.
  Null when error is non-null.
  """
  reflection: RetroReflection
  """
  The new RetroReflectionGroup automatically created to hold this reflection.
  Every reflection starts in its own group; groups are later merged during the
  group phase. The group's title is initially derived from the reflection text
  and may be asynchronously upgraded to an AI-generated title.
  Null when error is non-null.
  """
  reflectionGroup: RetroReflectionGroup
  """
  Any meeting stages that were unlocked as a side-effect of adding this reflection.
  Specifically, the group phase stages are unlocked the first time any reflection is
  added to the meeting (i.e. when the group phase was not yet navigable by the
  facilitator). Empty or null when no stages changed state.
  """
  unlockedStages: [NewMeetingStage!]
}

"""
Return value for the createStripeSubscription mutation, which creates a new Stripe subscription
for an organization that does not yet have one. The caller provides an orgId and a Stripe
paymentMethodId. On success the mutation creates (or reuses) a Stripe customer, attaches the
payment method, and creates a team subscription billed by the number of active org members,
applying any pending coupon before clearing it from the org record.

Success: returns CreateStripeSubscriptionSuccess with a client secret the client must use to
confirm payment via the Stripe.js SDK (e.g. stripe.confirmCardPayment).

Failure: returns ErrorPayload. Common error cases include the organization already having an
active subscription, or Stripe rejecting the customer or payment method creation.
"""
union CreateStripeSubscriptionPayload = ErrorPayload | CreateStripeSubscriptionSuccess

"""
Returned by the createStripeSubscription mutation when a new Stripe subscription has been
successfully created for the given organization. The caller must use the
stripeSubscriptionClientSecret to confirm payment on the client side (e.g. via
stripe.confirmCardPayment) before the subscription becomes active.

Failure cases surfaced as ErrorPayload instead:
- The organization already has an active Stripe subscription (stripeSubscriptionId is set).
- Creating or retrieving the Stripe customer fails.
- Attaching the payment method to an existing customer fails.
"""
type CreateStripeSubscriptionSuccess {
  """
  The client secret from the Stripe PaymentIntent on the subscription's latest invoice.
  Pass this to stripe.confirmCardPayment (or equivalent) on the client using the
  Stripe publishable key to complete 3DS / SCA payment confirmation and activate the
  subscription. This value is single-use and short-lived; confirm payment immediately
  after receiving it.
  """
  stripeSubscriptionClientSecret: String!
}

"""
Input for the createTask mutation. Used to create a new task on a team, optionally scoped to a
meeting and/or a discussion thread. Tasks are the core unit of work in Parabol — they appear on
team and personal dashboards, can be assigned to a team member, and can be mirrored to an external
service (GitHub, GitLab, Jira, etc.) at creation time.

Required fields: status and teamId.

Failure cases:
- The viewer is not a member of the meeting specified by meetingId.
- The discussionId does not belong to the meeting specified by meetingId, or does not belong to the team.
- The userId is not a member of the team.
- The integration field refers to a project the viewer is not authorized to push to, or the external
  service returns an error.

Success: returns CreateTaskPayload with the newly created Task and any NotifyTaskInvolves
notifications generated for the assignee or @mentioned users.
"""
input CreateTaskInput {
  """
  The rich-text body of the task encoded as a TipTap/ProseMirror JSON document serialized to a
  string. If omitted or null, the task is created with an empty body. Inline @mentions of user IDs
  cause MENTIONEE notifications to be sent to those users. Tags such as #private and #archived can
  be embedded in the content and affect task visibility.
  """
  content: String
  """
  Plain-text version of the task body. When provided this value is stored directly; when omitted
  the server derives it from the content field. Useful for full-text search and notification
  previews.
  """
  plaintextContent: String
  """foreign key for the meeting this was created in"""
  meetingId: ID
  """foreign key for the thread this was created in"""
  discussionId: ID
  """
  The sort position of this task within its parent thread, used to order threaded replies relative
  to threadParentId. Only meaningful when threadParentId is set.
  """
  threadSortOrder: Int
  """
  The ID of the parent Threadable item (e.g. a reflection or comment) when this task is created as
  a reply inside a discussion thread. Null for top-level tasks.
  """
  threadParentId: ID
  """
  The position of this task in the shared team/user dashboard kanban column. Used by drag-and-drop
  ordering. If omitted, the server assigns a noise value that places the task at the end of the
  list.
  """
  sortOrder: Float
  """
  The initial workflow status of the task. Must be one of: active, stuck, done, or future. This
  field is required — there is no server-side default.
  """
  status: TaskStatusEnum!
  """teamId, the team the task is on"""
  teamId: ID!
  """
  userId, the owner of the task. This can be null if the task is not assigned to anyone.
  """
  userId: ID
  """
  When provided, the task is simultaneously pushed to an external project management service
  (e.g. GitHub, GitLab, Jira) at creation time. The viewer must have a valid OAuth integration
  with the service. If the external call fails, the entire mutation returns an error and no task
  is persisted locally.
  """
  integration: CreateTaskIntegrationInput
}

"""
Specifies which external project or repository a newly created Parabol task should be pushed to as
an issue/work-item. Used as the optional `integration` field on CreateTaskInput when calling the
`createTask` mutation, and also accepted directly by the `createTaskIntegration` mutation to link
an existing task that has no integration yet.

The caller must have a valid OAuth token for the target service (stored via the team's integration
settings). If neither the viewer nor the task assignee has an active token, the mutation returns an
error. Providing this input when the task already has an integration also returns an error.

Success: the external issue is created, the Task record is updated with an `integrationHash` and
`integration` sub-object, and a TaskSubscription notification is published to all team members.
"""
input CreateTaskIntegrationInput {
  """
  The external service where the issue should be created. Must match one of the configured
  integration providers for the team. Determines how `serviceProjectHash` is interpreted and which
  OAuth credentials are used.
  """
  service: TaskServiceEnum!
  """
  A service-specific identifier for the project or repository that will own the new issue.
  The required format differs by service:
  - github:      "owner/repo"  (nameWithOwner, e.g. "ParabolInc/parabol")
  - jira:        "cloudId:projectKey"  (e.g. "abc123:ENG")
  - jiraServer:  service-specific composite key for the Jira Server project
  - gitlab:      full project path (e.g. "group/subgroup/project")
  - azureDevOps: IntegrationRepoId composite (instanceId:projectId)
  - linear:      Linear team/project identifier
  Passing an unrecognised format for the selected service will cause task creation to fail.
  """
  serviceProjectHash: String!
}

"""
Payload returned by the createTaskIntegration mutation, which pushes an existing Parabol task to
an external issue tracker (e.g. Jira, GitHub) and links the two records together.

Success: error is null and task reflects the newly linked external issue (task.integration is
populated with the service-specific data and task.integrationHash is set).

Failure: error is non-null and task is null. Common failure reasons include: task not found,
task is already linked to an external service, neither the viewer nor the assignee has an active
auth token for the requested integration, or the external service call itself failed.
"""
type CreateTaskIntegrationPayload {
  """
  Present when the mutation failed. Describes why the task could not be pushed to the external
  integration (e.g. missing auth, task already linked, downstream API error).
  """
  error: StandardMutationError
  """
  The Parabol task after it has been successfully linked to the external issue. Contains the
  updated integration metadata (integrationHash, integration service details) returned by the
  external provider. Null when error is non-null.
  """
  task: Task
}

"""
Returned by the createTask mutation. On success, contains the newly created
task and any involvement notifications that were generated. On failure,
contains a StandardMutationError and null task/notification fields.

Success conditions: the viewer is a member of the target team, the optional
meetingId belongs to a meeting the viewer is currently in, the optional
discussionId is valid and belongs to the same meeting and team, and the
optional userId (assignee) is a member of the same team.

Failure conditions: viewer is not on the team, meetingId refers to a meeting
the viewer has not joined, discussionId is inconsistent with the meetingId or
teamId, the assignee userId is not a team member, or the optional integration
(e.g. GitHub/GitLab/Jira) fails to create a linked issue.

Subscription channels: the payload is also published via the TASK subscription
channel to all team members (excluding private tasks) and via the NOTIFICATION
channel to any user who was assigned or mentioned in the task content.
"""
type CreateTaskPayload {
  """
  Present when the mutation fails. Contains a human-readable message describing
  why the task could not be created (e.g. permission error, invalid meeting,
  integration failure).
  """
  error: StandardMutationError
  """The newly created task. Null when error is present."""
  task: Task
  """
  A notification sent to the assigned user or any user mentioned in the task
  content, indicating they are now involved with this task. Null when no such
  involvement notification was triggered (e.g. the creator assigned it to
  themselves, or the task has no assignee and no mentions).
  """
  involvementNotification: NotifyTaskInvolves
}

"""
Safe, display-only summary of a credit card on file for an organization, sourced from Stripe.

Returned on `Organization.creditCard` when the org has an active paid subscription with a saved
payment method. The field is null when the org is on a free plan or has no card on file.

To update the card, call the `updateCreditCard` mutation (requires `ORGS_WRITE` scope / billing
leader role), passing the Stripe `paymentMethodId` obtained from the client-side Stripe Elements
flow. On success, `UpdateCreditCardSuccess` returns the updated `Organization` (with a fresh
`CreditCard` here) plus a `stripeSubscriptionClientSecret` for confirming the payment intent.

No sensitive data (full card number, CVV) is ever stored or returned — only the brand, expiry,
and last four digits needed to identify the card to the user.
"""
type CreditCard {
  """The brand of the credit card, as provided by stripe"""
  brand: String!
  """The MM/YY string of the expiration date"""
  expiry: String!
  """The last 4 digits of a credit card"""
  last4: String!
}

"""
An ISO 8601 UTC datetime scalar. Serialized as a string in the format
`YYYY-MM-DDTHH:MM:SS.SSSZ` (e.g. `"2024-03-15T14:30:00.000Z"`), which is
the output of JavaScript's `Date.prototype.toJSON()`.

**Sending a DateTime to the server (inputs/variables):** pass an ISO 8601
string. The value must round-trip through `new Date(value).toJSON()` — in
practice this means a full UTC timestamp such as `"2024-03-15T14:30:00.000Z"`
or a date-only prefix like `"2024-03-15"` whose expansion starts with the
supplied string. Partial strings that do not satisfy this check are rejected.

**Receiving a DateTime from the server (query results):** the value is always
a full UTC timestamp string in the form `YYYY-MM-DDTHH:MM:SS.SSSZ`, safe to
pass directly to `new Date()`.
"""
scalar DateTime

"""
Return type for the deleteComment mutation. Resolves to DeleteCommentSuccess on success
or ErrorPayload when the operation fails.

Common error cases:
- The comment does not exist or is no longer active
- The commentId does not belong to the specified meetingId
- The viewer is not the author of the comment (only the original author or Parabol AI comment owners may delete)
- The viewer is not a member of the meeting (enforced by the @scope directive)
"""
union DeleteCommentPayload = ErrorPayload | DeleteCommentSuccess

"""
Returned by the deleteComment mutation when the comment is successfully soft-deleted.
The comment record is retained so that reply threading is preserved, but its content
is replaced with tombstone text and isActive is set to false on the Comment object.

Mutation signature:
  deleteComment(commentId: ID!, meetingId: ID!): DeleteCommentPayload!

Success conditions:
  - The comment exists and is still active (isActive true).
  - The comment belongs to a discussion whose meetingId matches the supplied meetingId.
  - The viewer is the comment author, OR the comment was posted by the Parabol AI user.

Failure conditions (returns ErrorPayload instead):
  - Comment does not exist or was already deleted.
  - The comment's discussion is not associated with the provided meetingId.
  - The viewer is not the comment author and the comment was not posted by the Parabol AI.

A DeleteCommentSuccess message is also broadcast on the MEETING subscription channel so
all participants in the meeting receive the update in real time.
"""
type DeleteCommentSuccess {
  """
  The ID of the comment that was deleted. Use this to remove or tombstone the comment
  in client-side caches and optimistic updates without needing to read the full Comment object.
  """
  commentId: ID!
  """
  The full Comment object as it exists after deletion. isActive will be false and content
  will contain tombstone placeholder text. Replies and other metadata are preserved.
  """
  comment: Comment!
}

"""
Returned by the deleteOAuthAPIProvider mutation after an OAuth API provider is
permanently removed from an organization.

Use this mutation to delete a provider that was previously created for
machine-to-machine OAuth flows. Requires the ORGS_WRITE scope.

Success: deletedProviderId is populated with the opaque client-side ID of the
removed provider so the caller can evict it from any local cache or list.

Failure: a GraphQL error is thrown (not returned as a field) when the provider
does not exist or cannot be found, e.g. "Provider not found".
"""
type DeleteOAuthAPIProviderPayload {
  """
  The opaque client-side ID of the OAuth API provider that was deleted.
  Use this to remove the provider from any locally cached list or relay store.
  Matches the providerId argument passed to the mutation.
  """
  deletedProviderId: ID!
}

"""
Payload returned by the deleteTask mutation. Permanently removes a task record
from the database (hard delete — not an archive or soft-delete). On success,
task is populated with the deleted task's data and the deletion is broadcast via
the TASK subscription channel to all team members who had visibility of the task
(private tasks are only broadcast to the task owner). On failure, error is set
and task is null.
"""
type DeleteTaskPayload {
  """
  Present when the mutation fails. Common reasons: the requested task does not
  exist or the caller does not have permission to delete it.
  """
  error: StandardMutationError
  """
  The task that was deleted, returned so clients can optimistically remove it
  from local caches or subscription listeners. Null when an error occurred.
  """
  task: Task
}

"""
Returned by the deleteUser mutation. Represents the outcome of a request to
permanently soft-delete a user account. A successful deletion removes the user
from all teams and organizations, blacklists their JWT, clears their auth
cookie (when a user deletes their own account), and broadcasts a mention update
to replace any in-progress references to that user. On success all fields are
null. On failure only error is populated.
"""
type DeleteUserPayload {
  """
  Populated when the mutation fails. Common failure reasons: supplying both
  userId and email (mutually exclusive), supplying neither, attempting to
  delete a different user without super-user privileges, or calling the
  mutation outside the re-authentication window required for self-deletion.
  Null on success.
  """
  error: StandardMutationError
}

"""
Payload returned by the denyPushInvitation mutation.

A push invitation is a request made by a user to join a team without a direct invite link.
Team members can approve or deny these requests. This payload is returned when a team member
denies such a request, incrementing the denial count on the PushInvitation record and
broadcasting the result via the TEAM subscription channel.

Success: teamId and userId are both present and error is null.
Failure: error is set and teamId/userId may be null. Common failure cases include:
  - The caller is not a member of the specified team.
  - No pending push invitation exists from the specified user to the specified team.
"""
type DenyPushInvitationPayload {
  error: StandardMutationError
  """
  The ID of the team to which the push invitation was denied.
  Present on success; used by subscribers to identify which team's invitation list changed.
  """
  teamId: ID
  """
  The ID of the user whose push invitation was denied.
  Present on success; identifies the user who will not be added to the team.
  """
  userId: ID
}

"""
Pushed via the notificationSubscription to all team members when a user's last
WebSocket connection closes. This is not the result of a mutation — the server
emits it automatically from the onDisconnect handler once it confirms the user
has no remaining open sockets (socketCount === 0). Subscribers use this payload
to update presence indicators, e.g. marking the user as offline in the UI.

Success: user is present and reflects the now-disconnected user.
No-op / not emitted: if the user still has other open connections (e.g. multiple
browser tabs), the payload is suppressed and presence is unchanged.
"""
type DisconnectSocketPayload {
  """
  The user who just fully disconnected (all sockets closed). Use this to update
  presence state — the user should be treated as offline after receiving this payload.
  """
  user: User
}

"""
A phase in a retrospective meeting where the team discusses the top-voted reflection groups one at a time.
This is the final structured phase of a retro — after grouping and voting, the team works through each
discussion topic in priority order. Each topic gets its own RetroDiscussStage, and the facilitator
advances through them sequentially. Use this type to render the discuss phase UI, navigate between
discussion topics, or inspect which topics remain.
"""
type DiscussPhase implements NewMeetingPhase {
  """Unique identifier for this phase instance (shortid)"""
  id: ID!
  """The ID of the retrospective meeting this discuss phase belongs to"""
  meetingId: ID!
  """The ID of the team running this meeting"""
  teamId: ID!
  """The type of phase — always "discuss" for this type"""
  phaseType: NewMeetingPhaseTypeEnum!
  """
  Ordered list of discussion stages, one per top-voted reflection group. Each stage represents a
  single topic the team will discuss. Stages are sorted by vote count (highest first) so the most
  important topics are discussed while energy is highest.
  """
  stages: [RetroDiscussStage!]!
}

"""
A threaded discussion attached to a specific topic within a meeting. Each Discussion belongs to
one meeting and one topic (e.g. a retro reflection group, an agenda item, or an issue from an
integration like GitHub or Jira). It acts as the container for all comments and tasks created
during that conversation. Use this type to render the comment thread UI, show participant
activity, and paginate thread items for a given topic.
"""
type Discussion {
  """The unique identifier for this discussion thread."""
  id: ID!
  """The ID of the team that owns the meeting this discussion belongs to."""
  teamId: ID!
  """The team that owns the meeting this discussion belongs to."""
  team: Team!
  """The ID of the meeting in which this discussion takes place."""
  meetingId: ID!
  """The timestamp when this discussion thread was created."""
  createdAt: DateTime!
  """
  The ID of the entity being discussed. The meaning depends on discussionTopicType — for example,
  an AgendaItem ID, a RetroReflectionGroup ID, a Task ID, or an external issue ID from an
  integration such as GitHub or Jira.
  """
  discussionTopicId: ID!
  """
  The type of entity being discussed, used together with discussionTopicId to resolve the actual
  topic object. Possible values include agendaItem, reflectionGroup, task, githubIssue, jiraIssue,
  and teamPromptResponse.
  """
  discussionTopicType: DiscussionTopicTypeEnum!
  """
  The meeting stage associated with this discussion, if the meeting is currently on that stage.
  Null when the meeting has not yet reached this topic's stage or the stage cannot be determined.
  """
  stage: NewMeetingStage
  """The total number of comments posted in this discussion thread."""
  commentCount: Int!
  """
  The list of users who are currently composing a comment in this discussion. Use this to render
  a live "someone is typing…" indicator.
  """
  commentors: [User!]!
  """
  A paginated connection containing the comments and tasks that make up this discussion thread,
  ordered by their sort position. Use first/after for cursor-based pagination.
  """
  thread(
    """
    The maximum number of thread items to return in a single page. Omit to fetch all items when
    only comments are needed and volume is expected to be small.
    """
    first: Int
    """
    The cursor (incrementing sort order value as a string) to start paging from, enabling
    forward pagination through the thread.
    """
    after: String
  ): ThreadableConnection!
}

"""
Interface implemented by every meeting stage that hosts a live discussion thread.
Any stage that lets participants post comments and tasks during a meeting implements this interface.

Concrete implementations (and the meeting type each belongs to):
- RetroDiscussStage — Retrospective meeting, Discuss phase. One stage per voted-on reflection group.
- EstimateStage — Sprint Poker meeting, Estimate phase. One stage per task being pointed.
- AgendaItemsStage — Check-In meeting, AgendaItems phase. One stage per agenda item.
- TeamPromptResponseStage — Standup (Team Prompt) meeting, Responses phase. One stage per team member.

When querying a stage, check for this interface to determine whether a discussion thread is available.
Use discussionId as the stable key for subscriptions, mutations (e.g. createComment, editComment),
and any other operation that targets a specific thread.
"""
interface DiscussionThreadStage {
  """
  The ID of the Discussion record that holds the comment and task thread for this stage.
  Use this as the key when subscribing to thread updates or when calling mutations that
  operate on a discussion (e.g. createComment, deleteComment, editComment).
  Each stage has exactly one discussion; the ID is stable for the lifetime of the stage.
  """
  discussionId: ID!
  """
  The Discussion object containing the full comment and task thread for this stage,
  including commentCount, active commentors, and the paginated thread connection.
  Prefer this over discussionId when you need to read thread data rather than just reference it.
  """
  discussion: Discussion!
}

"""
Identifies the type of entity that is the subject of a Discussion thread. Each Discussion belongs
to exactly one meeting and one topic entity. The topic type determines which meeting phase owns
the discussion and how the discussionTopicId foreign key should be resolved.
"""
enum DiscussionTopicTypeEnum {
  """
  An agenda item in an Action (check-in) meeting. The discussionTopicId references an AgendaItem.
  One discussion is created per agenda item stage when the team works through the agenda.
  """
  agendaItem
  """
  A reflection group (theme) in the Discuss phase of a Retrospective meeting. The discussionTopicId
  references a RetroReflectionGroup. One discussion is created per group so the team can comment
  and create tasks around each theme.
  """
  reflectionGroup
  """
  A Parabol task being estimated in a Sprint Poker meeting. The discussionTopicId references a Task.
  Used when the item being pointed is a native Parabol task rather than an external issue.
  """
  task
  """
  A GitHub issue being estimated in a Sprint Poker meeting. The discussionTopicId references a
  GitHub issue. Used when the item pulled into the Estimate phase originates from GitHub.
  """
  githubIssue
  """
  A Jira issue being estimated in a Sprint Poker meeting. The discussionTopicId references a
  Jira issue. Used when the item pulled into the Estimate phase originates from Jira.
  """
  jiraIssue
  """
  A team member's standup response in a Team Prompt (async standup) meeting. The discussionTopicId
  references a TeamMember. One discussion is created per team member so others can reply to that
  person's update.
  """
  teamPromptResponse
}

