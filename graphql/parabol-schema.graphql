"""A long-term task shared across the team, assigned to a single user"""
type Task implements Threadable {
  """Unique identifier"""
  id: ID!
  """The rich text body of the item"""
  content: String!
  """The timestamp the item was created"""
  createdAt: DateTime!
  """The userId that created the item"""
  createdBy: ID!
  """The user that created the item"""
  createdByUser: User!
  """the replies to this threadable item"""
  replies: [Threadable!]!
  """
  The FK of the discussion this task was created in. Null if task was not created in a discussion
  """
  discussionId: ID
  """the parent, if this threadable is a reply, else null"""
  threadParentId: ID
  """the order of this threadable, relative to threadParentId"""
  threadSortOrder: Int
  """The timestamp the item was updated"""
  updatedAt: DateTime!
  """The agenda item that the task was created in, if any"""
  agendaItem: AgendaItem @scope(name: MEETINGS_READ)
  """Type of the integration if there is one"""
  taskService: TaskServiceEnum
  """a user-defined due date"""
  dueDate: DateTime
  """A list of the most recent estimates for the task"""
  estimates: [TaskEstimate!]!
  """
  a list of users currently editing the task (fed by a subscription, so queries return null)
  """
  editors: [TaskEditorDetails!]!
  """The reference to the single source of truth for this task"""
  integration: TaskIntegration
  """A hash of the integrated task"""
  integrationHash: ID
  """The ID of the meeting the task was created in, if any"""
  meetingId: ID
  """The meeting the task was created in, if any."""
  meeting: NewMeeting @scope(name: MEETINGS_READ)
  """
  The discussion this task was created in, if any. For retrospective tasks, this resolves
  the reflection-group discussion via discussionId; use task.discussion.stage to reach the
  RetroDiscussStage with its reflectionGroup and stageIdx.
  """
  discussion: Discussion @scope(name: MEETINGS_READ)
  """The ID of the meeting in which this task was marked as done, if any"""
  doneMeetingId: ID
  """the plain text content of the task"""
  plaintextContent: String!
  """the shared sort order for tasks on the team dash & user dash"""
  sortOrder: Float!
  """The status of the task"""
  status: TaskStatusEnum!
  """The tags associated with the task"""
  tags: [String!]!
  """The id of the team (indexed). Needed for subscribing to archived tasks"""
  teamId: ID!
  """The team this task belongs to"""
  team: Team! @scope(name: TEAMS_READ)
  """The first block of the content"""
  title: String!
  """The ID of the user the task is assigned to. Null if unassigned."""
  userId: ID
  """
  The user the task is assigned to. Null if it is not assigned to anyone.
  """
  user: User @scope(name: USERS_READ)
  """The owner hovers over the task in their solo update of a checkin"""
  isHighlighted(
    """Meeting for which the highlight is checked"""
    meetingId: ID
  ): Boolean!
}

"""A paginated list of tasks"""
type TaskConnection {
  """Page info with cursors coerced to ISO8601 dates"""
  pageInfo: PageInfoDateCursor
  """A list of edges."""
  edges: [TaskEdge!]!
}

"""A cursor-based edge wrapping a single task in a paginated list"""
type TaskEdge {
  """The item at the end of the edge"""
  node: Task!
  cursor: DateTime
}

"""Details about a user currently editing a task in real time"""
type TaskEditorDetails {
  """The userId of the person editing the task"""
  userId: ID!
  """The name of the userId editing the task"""
  preferredName: String!
}

"""An estimate for a Task that was voted on and scored in a poker meeting"""
type TaskEstimate {
  """The ID of the estimate"""
  id: ID!
  """The timestamp the estimate was created"""
  createdAt: DateTime!
  """The source that a change came in through"""
  changeSource: ChangeSourceEnum!
  """The name of the estimate dimension"""
  name: String!
  """The human-readable label for the estimate"""
  label: String!
  """The task this estimate belongs to"""
  taskId: ID!
  """The userId that added the estimate"""
  userId: ID!
  """The meeting where this estimate was set, if any"""
  meetingId: ID
  """The meeting stageId the estimate occurred in, if any"""
  stageId: ID
  """The discussionId where the estimated was discussed"""
  discussionId: ID
  """
  If the task comes from jira, this is the jira field that the estimate refers to
  """
  jiraFieldId: ID
}

"""Input for setting or updating a task estimate in a poker meeting"""
input TaskEstimateInput {
  """The task being estimated"""
  taskId: ID!
  """The new estimate value"""
  value: String!
  """The name of the estimate, e.g. Story Points"""
  dimensionName: String!
  """The poker meeting where the estimate is being set"""
  meetingId: ID!
}

"""
A reference to a task that lives in an external integration (e.g. GitHub, Jira)
"""
interface TaskIntegration {
  id: ID!
}

"""How a user is involved with a task (listed in hierarchical order)"""
enum TaskInvolvementType {
  """The task is assigned to this user"""
  ASSIGNEE
  """The user is mentioned in the task"""
  MENTIONEE
}

"""The external service a task is integrated with"""
enum TaskServiceEnum {
  """GitHub"""
  github
  """Jira Cloud"""
  jira
  """Parabol (no external integration)"""
  PARABOL
  """Jira Server (self-hosted)"""
  jiraServer
  """GitLab"""
  gitlab
  """Azure DevOps"""
  azureDevOps
  """Linear"""
  linear
}

"""The status of a task"""
enum TaskStatusEnum {
  """In progress"""
  active
  """Blocked or needs attention"""
  stuck
  """Completed"""
  done
  """Planned for the future"""
  future
}

"""
Subscription payload for task-related changes visible to the current user
"""
type TaskSubscriptionPayload {
  fieldName: String!
  ChangeTaskTeamPayload: ChangeTaskTeamPayload
  CreateTaskIntegrationPayload: CreateTaskIntegrationPayload
  CreateTaskPayload: CreateTaskPayload
  DeleteTaskPayload: DeleteTaskPayload
  EditTaskPayload: EditTaskPayload
  RemoveOrgUsersSuccess: RemoveOrgUsersSuccess
  RemoveTeamMemberPayload: RemoveTeamMemberPayload
  UpdateTaskPayload: UpdateTaskPayload
  UpdateTaskDueDatePayload: UpdateTaskDueDatePayload
}

interface Node {
  id: ID!
}

"""A team"""
type Team implements Node & TeamPartial {
  """A shortid for the team"""
  id: ID!
  """The datetime the team was created"""
  createdAt: DateTime!
  """The userId that created the team. Non-null at v2.22.0+"""
  createdBy: ID
  """true if the team was created when the account was created, else false"""
  isOnboardTeam: Boolean!
  """The type of the last meeting run"""
  lastMeetingType: MeetingTypeEnum!
  """
  The datetime of the team's most recent meeting (from either active or completed meetings)
  """
  lastMetAt: DateTime
  """
  The hash and expiration for a token that allows anyone with it to join the team
  """
  massInvitation(
    """the meetingId to optionally direct them to"""
    meetingId: ID
  ): MassInvitation!
  """The name of the team"""
  name: String!
  """The organization to which the team belongs"""
  orgId: ID!
  """Arbitrary tags that the team uses"""
  tags: [String]
  """The datetime the team was last updated"""
  updatedAt: DateTime
  """The outstanding invitations to join the team"""
  teamInvitations: [TeamInvitation!]!
  """true if the viewer is the team lead, else false"""
  isViewerLead: Boolean!
  """The team-specific settings for running all available types of meetings"""
  meetingSettings(
    """the type of meeting for the settings"""
    meetingType: MeetingTypeEnum!
  ): TeamMeetingSettings!
  """A query for the scale"""
  scale(
    """The scale ID for the desired scale"""
    scaleId: ID!
  ): TemplateScale @scope(name: TEMPLATES_READ)
  """The list of scales this team can use"""
  scales: [TemplateScale!]! @scope(name: TEMPLATES_READ)
  """
  list of meetings that are currently in progress including active meetings of activeMeetingSeries
  """
  activeMeetings: [NewMeeting!]! @scope(name: MEETINGS_READ)
  """
  list of all active meeting series, a series can be active without having an active meeting
  """
  activeMeetingSeries: [MeetingSeries!]! @scope(name: MEETINGS_READ)
  """Whether the team has a feature flag enabled or not"""
  featureFlag(featureName: String!): Boolean!
  """
  The number of qualifying meetings that have an AI generated summary. Qualifying meetings are meetings with three or more meeting members and five or more reflections
  """
  qualAIMeetingsCount: Int!
  """The new meeting in progress, if any"""
  meeting(
    """The unique meetingId"""
    meetingId: ID!
  ): NewMeeting @scope(name: MEETINGS_READ)
  organization: Organization! @scope(name: ORGS_READ)
  """The agenda items for the upcoming or current meeting"""
  agendaItems: [AgendaItem!]! @scope(name: MEETINGS_READ)
  """All of the tasks for this team"""
  tasks(
    first: Int
    """the datetime cursor"""
    after: DateTime
  ): TaskConnection! @scope(name: TASKS_READ)
  """All the team members actively associated with the team"""
  teamMembers(
    """the field to sort the teamMembers by"""
    sortBy: String
  ): [TeamMember!]!
  """true if the team has been archived"""
  isArchived: Boolean
  """
  Whether or not new users with the same domain and a verified email should auto-join the team
  """
  autoJoin: Boolean!
  """Whether the viewer belongs to the team"""
  isViewerOnTeam: Boolean!
  """true if the viewer is an admin for the team's org, else false"""
  isOrgAdmin: Boolean!
  """The team's current billing tier"""
  tier: TierEnum!
  """
  The tier the team is actively billed at (may differ from tier during trials)
  """
  billingTier: TierEnum!
  """The team member that is the viewer"""
  viewerTeamMember: TeamMember
  """The team member that is the team lead"""
  teamLead: TeamMember!
  """The number of retro meetings the team has had"""
  retroMeetingsCount: Int!
  """
  Whether the team is visible to everyone in the org and anyone can join it without an invitation
  """
  isPublic: Boolean!
  """The viewer-specific sort order index. Present in User.teams"""
  sortOrder: String!
  """The list of Jira fields to be displayed alongside the task content"""
  jiraDisplayFieldIds: [String!]
}

"""The right drawer types available on the team dashboard"""
enum TeamDrawer {
  """The agenda items drawer"""
  agenda
  """The manage team members drawer"""
  manageTeam
}

"""The meeting phase where team members answer health check questions"""
type TeamHealthPhase implements NewMeetingPhase {
  """Unique identifier"""
  id: ID!
  meetingId: ID!
  teamId: ID!
  """The type of phase"""
  phaseType: NewMeetingPhaseTypeEnum!
  stages: [TeamHealthStage!]!
}

"""A single team health question stage where participants vote on a label"""
type TeamHealthStage implements NewMeetingStage {
  """Unique identifier"""
  id: ID!
  """The datetime the stage was completed"""
  endAt: DateTime
  """The ID of the meeting this stage belongs to"""
  meetingId: ID!
  """The meeting this stage belongs to"""
  meeting: NewMeeting!
  """
  true if the facilitator has completed this stage, else false. Should be boolean(endAt)
  """
  isComplete: Boolean!
  """true if any meeting participant can navigate to this stage"""
  isNavigable: Boolean!
  """true if the facilitator can navigate to this stage"""
  isNavigableByFacilitator: Boolean!
  """The phase this stage belongs to"""
  phase: NewMeetingPhase
  """The type of the phase"""
  phaseType: NewMeetingPhaseTypeEnum
  """The datetime the stage was started"""
  startAt: DateTime
  """Number of times the facilitator has visited this stage"""
  viewCount: Int
  """
  true if a time limit is set, false if end time is set, null if neither is set
  """
  isAsync: Boolean
  """true if the viewer is ready to advance, else false"""
  isViewerReady: Boolean!
  """User ids of those who are ready to advance to the next stage"""
  readyUserIds: [ID!]!
  """
  The datetime the phase is scheduled to be finished, null if no time limit or end time is set
  """
  scheduledEndTime: DateTime
  """
  The suggested ending datetime for a phase to be completed async, null if not enough data to make a suggestion
  """
  suggestedEndTime: DateTime
  """
  The suggested time limit for a phase to be completed together, null if not enough data to make a suggestion
  """
  suggestedTimeLimit: Float
  teamId: ID!
  """
  The number of milliseconds left before the scheduled end time. Useful for unsynced client clocks. null if scheduledEndTime is null
  """
  timeRemaining: Float
  """
  The 0-based position of this stage within its phase, ordered by sortOrder.
  """
  stageIdx: Int!
  """Team health question of the stage"""
  question: String!
  """Answer options for the question"""
  labels: [String!]!
  """The label the viewer voted for, if any"""
  viewerVote: String
  """
  Score counts for each label, in the same order as labels. Only available if isRevealed is true
  """
  votes: [Int!]
  """userIds of users who have voted"""
  votedUserIds: [ID!]!
  """Users who have voted"""
  votedUsers: [User!]!
  """True if the votes were revealed, else false"""
  isRevealed: Boolean!
}

"""An invitation to become a team member"""
type TeamInvitation {
  """The unique invitation Id"""
  id: ID!
  """null if not accepted, else the datetime the invitation was accepted"""
  acceptedAt: DateTime
  """null if not accepted, else the userId that accepted the invitation"""
  acceptedBy: ID
  """The datetime the invitation was created"""
  createdAt: DateTime!
  """The email of the invitee"""
  email: Email!
  """The datetime the invitation expires. Changes when team is archived."""
  expiresAt: DateTime!
  """The userId of the person that sent the invitation"""
  invitedBy: ID!
  """The userId of the person that sent the invitation"""
  inviter: User!
  """the meetingId that the invite was generated for"""
  meetingId: ID
  """The team invited to"""
  teamId: ID!
  """48-byte hex encoded random string"""
  token: ID!
}

"""The reason a team invitation could not be accepted"""
enum TeamInvitationErrorEnum {
  """The invitation was already accepted"""
  accepted
  """The invitation has expired"""
  expired
  """No matching invitation was found"""
  notFound
  """The invitee's email domain is not allowed on this team"""
  restrictedDomain
  """The invitee's email address has not been verified"""
  unverifiedEmail
}

"""The response to a teamInvitation query"""
type TeamInvitationPayload {
  """The team invitation, if any"""
  teamInvitation: TeamInvitation
  """the teamId of the team trying to join"""
  teamId: ID
  """one of the active meetings trying to join"""
  meetingId: ID
  """true if the viewer is already on the team"""
  isOnTeam: Boolean
}

"""The team settings for a specific type of meeting"""
interface TeamMeetingSettings {
  id: ID!
  """The type of meeting these settings apply to"""
  meetingType: MeetingTypeEnum!
  """The broad phase types that will be addressed during the meeting"""
  phaseTypes: [NewMeetingPhaseTypeEnum!]!
  """The ID of the team these settings belong to"""
  teamId: ID!
  """The team these settings belong to"""
  team: Team!
}

"""A member of a team"""
type TeamMember {
  """An ID for the teamMember. userId::teamId"""
  id: ID!
  """The datetime the team member was created"""
  createdAt: DateTime!
  """true if the user is a part of the team, false if they no longer are"""
  isNotRemoved: Boolean
  """Is user a team lead?"""
  isLead: Boolean!
  """true if the user prefers to not vote during a poker meeting"""
  isSpectatingPoker: Boolean!
  """
  the type of drawer that is open in the team dash. Null if the drawer is closed
  """
  openDrawer: TeamDrawer
  """true if this team member belongs to the user that queried it"""
  isSelf: Boolean!
  """
  The integrations that the team member has authorized. Only accessible by the team member themselves
  """
  integrations: TeamMemberIntegrations!
  """The meeting specifics for the meeting the team member is currently in"""
  meetingMember(meetingId: ID!): MeetingMember
  """The integrations that the team has previously used"""
  prevUsedRepoIntegrations(
    """the number of repo integrations to return"""
    first: Int!
    after: DateTime
  ): RepoIntegrationQueryPayload!
  """The integrations that the user would probably like to use"""
  repoIntegrations(
    """the number of repo integrations to return"""
    first: Int!
    after: DateTime
    """
    true if we should fetch from the network, false if we should use the cache
    """
    networkOnly: Boolean!
  ): RepoIntegrationQueryPayload!
  """Tasks owned by the team member"""
  tasks(
    first: Int
    """the datetime cursor"""
    after: DateTime
  ): TaskConnection
  """The team this team member belongs to"""
  team: Team
  """The ID of the team this member belongs to"""
  teamId: ID!
  """The user for the team member"""
  user: User!
  """The ID of the Parabol user"""
  userId: ID!
  """All the integrations that the user could possibly use"""
  allAvailableRepoIntegrations: [RepoIntegration!]!
  """Is user an admin of the team's org?"""
  isOrgAdmin: Boolean!
}

"""
Auth credentials linking a team member to an external integration provider
"""
interface TeamMemberIntegrationAuth {
  """The token's unique identifier"""
  id: ID!
  """The team that the token is linked to"""
  teamId: ID!
  """The timestamp the token was created"""
  createdAt: DateTime!
  """The timestamp the token was updated at"""
  updatedAt: DateTime!
  """The ID of the integration provider this token belongs to"""
  providerId: ID!
  """
