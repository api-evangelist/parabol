aid: parabol
name: Parabol
description: >-
  Parabol is an open-source collaborative workspace that helps teams run more
  effective, inclusive, and engaging meetings — retrospectives, sprint poker
  estimation, check-ins/standups, and collaborative Pages documents — all in
  real time. Parabol exposes a public GraphQL API at action.parabol.co/graphql
  authenticated with scoped Personal Access Tokens (Bearer), letting developers
  and AI agents start meetings, create reflections and tasks, read team and
  organization data, and subscribe to live meeting events. The platform is
  dual-licensed AGPLv3, self-hostable for air-gapped deployments, and integrates
  with Jira, GitHub, GitLab, Linear, Azure DevOps, Slack, and Mattermost.
