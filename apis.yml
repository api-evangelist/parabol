    Tokens passed as a Bearer token. A single root `viewer` query returns the
    authenticated user and their teams, meetings, tasks, and pages; mutations
    start and drive meetings, create reflections/tasks/pages/comments; and five
    subscriptions stream live meeting, team, organization, task, and
    notification events.
